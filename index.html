<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2447d8">
<title>Quiz Première Spé — Calcul algébrique — Faicel Missaoui</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--primary:#2447d8;--primary2:#eef2ff;--good:#18753c;--goodbg:#ecfdf3;--bad:#b42318;--badbg:#fff1f0;--border:#d9e0ea}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:"FAICEL MISSAOUI";position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-28deg);font-size:clamp(4rem,14vw,10rem);font-weight:900;letter-spacing:.08em;color:#14296f;opacity:.035;white-space:nowrap;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:820px;margin:auto;padding:18px}
.card{background:rgba(255,255,255,.97);border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:0 12px 36px rgba(15,23,42,.07)}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.brand strong{font-size:1.05rem;font-weight:900}.pill{padding:7px 11px;border-radius:999px;background:var(--primary2);color:#253b9d;font-weight:800;font-size:.88rem}
h1{font-size:clamp(1.6rem,5vw,2.35rem);line-height:1.15;margin:.25rem 0 .6rem}h2{margin:.2rem 0 .6rem}.subtitle{color:var(--muted);line-height:1.5}.teacher{font-weight:900}.rule{border-left:4px solid var(--primary);padding:10px 12px;background:#f8faff;border-radius:10px;margin:14px 0}.small{font-size:.92rem;color:var(--muted)}
.namebox{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:12px;font-size:1rem;margin:7px 0 12px;background:white}.btn{width:100%;border:1px solid var(--border);border-radius:13px;padding:13px 14px;font-size:1rem;font-weight:800;cursor:pointer;background:white;color:var(--text)}.btn.primary{background:var(--primary);color:white;border-color:var(--primary)}.btn.secondary{background:#fff}.btn.whatsapp{background:#eafff2;border-color:#9de2b5;color:#126b35}.btn:disabled{cursor:default;opacity:.85}
.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.phase{font-weight:850;color:#3446a7}.score{font-weight:900}.progress{height:10px;background:#e8ecf4;border-radius:999px;overflow:hidden;margin:10px 0 18px}.bar{height:100%;background:var(--primary);transition:width .25s ease}.question{font-size:1.28rem;font-weight:820;line-height:1.45;margin:16px 0}.options{display:grid;gap:10px}.option{width:100%;text-align:left;border:1px solid var(--border);border-radius:13px;padding:13px 14px;background:white;font-size:1rem;cursor:pointer;line-height:1.35}.option:hover:not(:disabled){border-color:var(--primary);transform:translateY(-1px)}.option.correct{background:var(--goodbg);border-color:#70d796;color:#135c2c}.option.wrong{background:var(--badbg);border-color:#f3a6a0;color:#7a271a}.letter{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#eef1f6;font-weight:900;margin-right:8px}
.feedback{margin-top:14px;padding:13px 14px;border-radius:12px;line-height:1.5}.feedback.good{background:var(--goodbg);border:1px solid #9be6b5;color:#135c2c}.feedback.bad{background:var(--badbg);border:1px solid #f2b6b1;color:#7a271a}.actions{display:grid;gap:9px;margin-top:13px}.result{font-size:3.5rem;font-weight:950;letter-spacing:-.04em;margin:8px 0}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}.metric{border:1px solid var(--border);border-radius:12px;padding:12px;background:#fafbfc}.metric b{display:block;font-size:1.35rem}.errors{display:grid;gap:10px;margin-top:16px}.error{border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff}.error .q{font-weight:800}.error .corr{color:var(--good);font-weight:800;margin-top:5px}.footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:12px}.hidden{display:none}
@media(max-width:560px){.wrap{padding:9px}.card{padding:15px;border-radius:15px}.summary{grid-template-columns:1fr}.question{font-size:1.15rem}.option{padding:12px}.result{font-size:3rem}}
</style>
</head>
<body>
<div class="wrap">
  <main class="card" id="app"></main>
  <div class="footer"><strong>Faicel Missaoui</strong> — Première spécialité mathématiques</div>
</div>
<script>
const Q=[
{p:"1 · Priorités et carrés",q:"Sans parenthèses, que vaut <b>−1²</b> ?",o:["−1","1","−2","Cela dépend"],a:0,e:"La puissance est prioritaire sur le signe − : −1² = −(1²) = −1."},
{p:"1 · Priorités et carrés",q:"Que vaut <b>(−1)²</b> ?",o:["−1","1","−2","0"],a:1,e:"Les parenthèses font de −1 la base entière : (−1)² = (−1)×(−1) = 1."},
{p:"1 · Priorités et carrés",q:"Pour tout réel x, <b>−x²</b> signifie :",o:["(−x)²","−(x²)","−2x","x²"],a:1,e:"Par convention, on calcule d’abord x² puis on prend son opposé : −x² = −(x²)."},
{p:"1 · Priorités et carrés",q:"Pour tout réel x, <b>(−x)²</b> est égal à :",o:["−x²","x²","−2x","x"],a:1,e:"(−x)² = (−x)(−x) = x². Les parenthèses changent donc le sens par rapport à −x²."},
{p:"1 · Priorités et carrés",q:"Si x = −3, quelles sont les valeurs de <b>−x²</b> et <b>(−x)²</b> ?",o:["−9 et 9","9 et −9","9 et 9","−9 et −9"],a:0,e:"−x² = −((−3)²)=−9, tandis que (−x)²=(3)²=9."},
{p:"2 · Puissances et réduction",q:"Quelle égalité est correcte ?",o:["a²b²=(ab)²","a²b²=(a+b)²","a²b²=a²+b²","a²b²=2ab"],a:0,e:"(ab)²=(ab)(ab)=a²b²."},
{p:"2 · Puissances et réduction",q:"Quelle est la factorisation de <b>a²−b²</b> ?",o:["(a−b)²","(a+b)²","(a−b)(a+b)","a(a−b)"],a:2,e:"C’est l’identité remarquable de la différence de deux carrés : a²−b²=(a−b)(a+b)."},
{p:"2 · Puissances et réduction",q:"Quelle écriture montre correctement que <b>9x²</b> est un carré ?",o:["9x²=(9x)²","9x²=(3x)²","9x²=(3x²)²","9x²=(9+x)²"],a:1,e:"(3x)²=3²x²=9x²."},
{p:"2 · Puissances et réduction",q:"Quel est le facteur commun monomial maximal de <b>9x², 3x² et 6x²</b> ?",o:["x","3x","3x²","6x²"],a:2,e:"Le PGCD de 9, 3 et 6 est 3, et tous les termes contiennent x² : le facteur commun maximal est 3x²."},
{p:"2 · Puissances et réduction",q:"Quelle réduction de <b>x²+3x</b> est correcte ?",o:["4x²","4x³","x²+3x","3x³"],a:2,e:"x² et 3x ne sont pas des termes de même degré. On ne peut pas les additionner en un seul monôme."},
{p:"3 · Facteur commun",q:"Factorise <b>x²+3x</b>.",o:["x(x+3)","x²(1+3)","3x(x+1)","x(x²+3)"],a:0,e:"Les deux termes contiennent x : x²+3x=x(x+3)."},
{p:"3 · Facteur commun",q:"Quelle égalité est correcte ?",o:["x²+x=2x²","x²+x=x(x+1)","x²+x=x³","x²+x=2x"],a:1,e:"On ne réduit pas x²+x. En revanche on peut factoriser par x : x²+x=x(x+1)."},
{p:"3 · Simplification",q:"Pour x ≠ 0, simplifie <b>(x²+x)/x</b>.",o:["x","x+1","x²+1","2x"],a:1,e:"On factorise le numérateur : (x²+x)/x = x(x+1)/x = x+1, puisque x≠0."},
{p:"3 · Simplification",q:"Pour x ≠ 0, simplifie <b>x² + x/x</b>.",o:["x+1","x²+1","x²+x","2x"],a:1,e:"Sans parenthèses, seule la fraction x/x vaut 1. Donc x²+x/x=x²+1."},
{p:"3 · Simplification",q:"Pour x ≠ 0, simplifie <b>(x²+3x)/x</b>.",o:["x+3","x²+3","4x","3x"],a:0,e:"x²+3x=x(x+3), donc (x²+3x)/x=x+3. On simplifie un facteur, jamais des termes séparés d’une somme."},
{p:"4 · Identités remarquables",q:"Factorise <b>9x²−25</b>.",o:["(9x−5)(9x+5)","(3x−5)(3x+5)","(3x−5)²","(9x−25)(x+1)"],a:1,e:"9x²=(3x)² et 25=5². Ainsi 9x²−25=(3x−5)(3x+5)."},
{p:"4 · Identités remarquables",q:"Factorise au maximum <b>9x²+6x</b>.",o:["3x(3x+2)","9x(x+6)","3x(3x+6)","x(9x+3)"],a:0,e:"Le facteur commun maximal est 3x : 9x²+6x=3x(3x+2)."},
{p:"4 · Identités remarquables",q:"Factorise <b>9x²+6x+1</b>.",o:["(3x+1)²","(3x−1)²","(9x+1)²","(3x−1)(3x+1)"],a:0,e:"9x²=(3x)², 1=1² et 6x=2×3x×1 : c’est (3x+1)²."},
{p:"5 · Erreurs classiques",q:"Quelle égalité est <b>fausse en général</b> ?",o:["(a+b)²=a²+2ab+b²","(a−b)²=a²−2ab+b²","a²−b²=(a−b)(a+b)","(a+b)²=a²+b²"],a:3,e:"Le double produit ne disparaît pas : (a+b)²=a²+2ab+b²."},
{p:"5 · Synthèse",q:"Pour x ≠ 0, simplifie <b>(x²+3x)/x − (x+3)</b>.",o:["0","x","3","x+3"],a:0,e:"Comme (x²+3x)/x=x+3, l’expression vaut (x+3)−(x+3)=0."}
];
let i=0,score=0,student="",answers=[];
const app=document.getElementById('app');
const letters=['A','B','C','D'];
function shareQuiz(){const txt='Quiz Première Spé — calcul algébrique et factorisation — Faicel Missaoui : '+location.href;window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}
function start(){app.innerHTML=`<div class="brand"><strong>Faicel Missaoui</strong><span class="pill">Première Spé · 20 questions · /20</span></div><h1>Calcul algébrique : éviter les erreurs classiques</h1><p class="subtitle">Quiz progressif avec correction immédiate : priorités, carrés, réduction, facteur commun, identités remarquables et simplification de fractions algébriques.</p><div class="rule"><b>Point de vigilance :</b> −x² et (−x)² ne désignent pas la même expression. Les parenthèses sont essentielles.</div><label for="student"><b>Prénom de l’élève</b> <span class="small">(facultatif)</span></label><input id="student" class="namebox" placeholder="Ex. Lina"><div class="actions" style="display:grid"><button class="btn primary" id="begin">Commencer</button><button class="btn whatsapp" id="share">Partager ce quiz sur WhatsApp</button></div>`;document.getElementById('begin').onclick=begin;document.getElementById('share').onclick=shareQuiz}
function begin(){student=document.getElementById('student').value.trim();i=0;score=0;answers=[];render()}
function render(){const q=Q[i];const pct=(i/Q.length)*100;app.innerHTML=`<div class="brand"><strong>Faicel Missaoui</strong><span class="pill">Question ${i+1}/20</span></div><div class="topline"><span class="phase">${q.p}</span><span class="score">Score : ${score}/20</span></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="question">${q.q}</div><div class="options" id="opts">${q.o.map((x,k)=>`<button class="option" data-k="${k}"><span class="letter">${letters[k]}</span>${x}</button>`).join('')}</div><div id="fb"></div><div class="actions" id="nextbox"></div>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>choose(Number(b.dataset.k)))}
function choose(k){const q=Q[i];const btns=[...document.querySelectorAll('.option')];btns.forEach(b=>b.disabled=true);btns[q.a].classList.add('correct');if(k!==q.a)btns[k].classList.add('wrong');const ok=k===q.a;if(ok)score++;answers.push({q:q.q.replace(/<[^>]+>/g,''),chosen:q.o[k],correct:q.o[q.a],ok,e:q.e});const fb=document.getElementById('fb');fb.className='feedback '+(ok?'good':'bad');fb.innerHTML=`<b>${ok?'Bonne réponse.':'À corriger.'}</b><br>${q.e}${ok?'':`<br><b>Réponse attendue :</b> ${q.o[q.a]}`}`;const box=document.getElementById('nextbox');box.innerHTML=`<button class="btn primary" id="next">${i===Q.length-1?'Voir mon bilan':'Question suivante'}</button>`;document.getElementById('next').onclick=()=>{i++;if(i<Q.length)render();else finish()}}
function finish(){const pct=Math.round(score/20*100);let msg=score>=18?'Maîtrise très solide':score>=15?'Bon niveau':score>=12?'Bases acquises, quelques automatismes à renforcer':score>=8?'Révisions ciblées nécessaires':'Reprendre les priorités et la factorisation pas à pas';app.innerHTML=`<div class="brand"><strong>Faicel Missaoui</strong><span class="pill">Bilan</span></div><h2>${student?student+', ':''}résultat du quiz</h2><div class="result">${score}/20</div><p class="subtitle"><b>${msg}</b></p><div class="summary"><div class="metric"><span class="small">Réussite</span><b>${pct}%</b></div><div class="metric"><span class="small">Erreurs</span><b>${20-score}</b></div></div><div class="actions" style="display:grid"><button class="btn primary" id="review">Revoir mes erreurs et les corrections</button><button class="btn secondary" id="restart">Recommencer</button><button class="btn whatsapp" id="shareScore">Partager mon score sur WhatsApp</button></div><div id="errors" class="errors hidden"></div>`;document.getElementById('restart').onclick=start;document.getElementById('review').onclick=review;document.getElementById('shareScore').onclick=shareScore}
function review(){const e=document.getElementById('errors');const wrong=answers.filter(x=>!x.ok);e.classList.remove('hidden');e.innerHTML=wrong.length?wrong.map((x,n)=>`<div class="error"><div class="q">${n+1}. ${x.q}</div><div>Ta réponse : ${x.chosen}</div><div class="corr">Correction : ${x.correct}</div><div class="small">${x.e}</div></div>`).join(''):`<div class="feedback good"><b>20/20 :</b> aucune erreur à revoir.</div>`;e.scrollIntoView({behavior:'smooth',block:'start'})}
function shareScore(){const who=student?student+' : ':'';const txt=`${who}${score}/20 au quiz Première Spé de Faicel Missaoui — calcul algébrique et factorisation. ${location.href}`;window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}
start();
</script>
</body>
</html>
