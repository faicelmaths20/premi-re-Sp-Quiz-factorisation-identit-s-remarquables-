<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#172033;--muted:#6e7789;--navy:#102a5c;--primary:#2447d8;--primary2:#eef2ff;--teal:#167b7a;--gold:#c79a3d;--good:#18753c;--goodbg:#ecfdf3;--bad:#b42318;--badbg:#fff1f0;--border:#d9e0ea}

.wrap{position:relative;z-index:1;max-width:920px;margin:auto;padding:16px}.card{background:rgba(255,255,255,.988);border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:0 12px 36px rgba(15,23,42,.07)}

:#7a271a}.actions{display:grid;gap:9px;margin-top:13px}.result{font-size:3.5rem;font-weight:950;letter-spacing:-.04em;margin:8px 0;color:var(--navy)}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}.metric{border:1px solid var(--border);border-radius:12px;padding:12px;background:#fafbfc}.metric b{display:block;font-size:1.35rem}.errors{display:grid;gap:10px;margin-top:16px}.error{border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff}.error .q{font-weight:800}.error .corr{color:var(--good);font-weight:800;margin-top:5px}.figure{margin:12px auto 15px;max-width:560px}.figure svg{width:100%;height:auto;border:1px solid var(--border);border-radius:13px;background:#fff}.footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:12px}.footer strong{font-family:Georgia,serif;color:var(--navy)}.hidden{display:none}

const Q=[{"p":"1 · Prérequis : mise sous forme standard","q":"Pour résoudre <b>3x²+7=5x</b> par le discriminant, quels coefficients faut-il utiliser ?","o":["a=3, b=5, c=7","a=3, b=−5, c=7","a=3, b=−5, c=−7","a=−3, b=5, c=−7"],"a":1,"e":"On ramène tout dans un même membre : <b>3x²−5x+7=0</b>. Ainsi a=3, b=−5, c=7. Erreur classique : lire b avant d’avoir écrit l’équation sous la forme ax²+bx+c=0."},{"p":"1 · Prérequis : discriminant","q":"Quel est le discriminant de <b>2x²+4x−6</b> ?","o":["Δ=−32","Δ=16","Δ=64","Δ=80"],"a":2,"e":"<b>Δ=b²−4ac=4²−4×2×(−6)=16+48=64.</b> Le signe de c est essentiel : ici −4ac devient positif."},{"p":"1 · Prérequis : interpréter Δ","q":"On considère un trinôme P(x)=ax²+bx+c avec <b>a&gt;0</b> et <b>Δ&lt;0</b>. Quelle affirmation est toujours vraie ?","o":["P(x)&lt;0 pour tout x","P(x)&gt;0 pour tout x","P change de signe une fois","P s’annule deux fois"],"a":1,"e":"Si Δ&lt;0, le trinôme n’a aucune racine réelle et garde <b>le signe de a</b>. Comme a&gt;0, on a P(x)&gt;0 pour tout réel x."},{"p":"2 · Équations : deux racines","q":"Résoudre dans ℝ : <b>3x²−2x−1=0</b>.","o":["S={−1 ; 1/3}","S={−1/3 ; 1}","S={1/3 ; 1}","S={−1/3 ; −1}"],"a":1,"e":"Δ=(−2)²−4×3×(−1)=16. Donc <b>x=(2±4)/6</b>, soit x=−1/3 ou x=1. Attention au dénominateur 2a=6."},{"p":"2 · Équations : valeurs exactes","q":"Résoudre dans ℝ : <b>x²−6x+7=0</b>.","o":["S={3−√2 ; 3+√2}","S={3−2√2 ; 3+2√2}","S={−3−√2 ; −3+√2}","S={6−√2 ; 6+√2}"],"a":0,"e":"Δ=36−28=8 et √8=2√2. Ainsi <b>x=(6±2√2)/2=3±√2</b>. On simplifie avant de donner la réponse."},{"p":"2 · Équations : paramètre","q":"Pour tout réel m, quelle factorisation de <b>x²+(m−1)x−m</b> est correcte ?","o":["(x+1)(x−m)","(x−1)(x+m)","(x−m)(x−m+1)","(x+1)(x+m)"],"a":1,"e":"On vérifie : <b>(x−1)(x+m)=x²+(m−1)x−m</b>. Cela montre aussi que 1 est une racine pour tout m et que l’autre racine est −m."},{"p":"2 · Équations : racine double","q":"Résoudre <b>4x²+12x+9=0</b>.","o":["S={−3/2}","S={3/2}","S={−3 ; −3/2}","S=∅"],"a":0,"e":"Δ=12²−4×4×9=0. Il y a une racine double : <b>x₀=−12/(2×4)=−3/2</b>. On peut aussi reconnaître (2x+3)²."},{"p":"3 · Courbe : lire les racines","q":"La courbe représente <b>f(x)=(x−1)²−1</b>. Quel est l’ensemble des solutions de <b>f(x)=0</b> ?","o":["S={1}","S={−1 ; 1}","S={0 ; 2}","S=[0 ; 2]"],"a":2,"e":"Les solutions sont les <b>abscisses des intersections avec l’axe des abscisses</b> : 0 et 2. Une équation f(x)=0 donne des points isolés ici, pas un intervalle.","fig":"roots"},{"p":"3 · Courbe : signe d’un trinôme","q":"La courbe représente <b>P(x)=−2x²+3x+2</b>. Résoudre <b>P(x)≥0</b>.","o":["]−1/2 ; 2[","[−1/2 ; 2]","]−∞ ; −1/2] ∪ [2 ; +∞[","{−1/2 ; 2}"],"a":1,"e":"La parabole est au-dessus ou sur l’axe entre ses deux racines. Donc <b>S=[−1/2 ; 2]</b>. Les bornes sont incluses car l’inégalité est large.","fig":"negative"},{"p":"3 · Courbes : comparer deux fonctions","q":"On pose <b>f(x)=x²−2x−3</b> et <b>g(x)=x−3</b>. Pour quelles valeurs de x a-t-on <b>f(x)≤g(x)</b> ?","o":["S=[−1 ; 3]","S=[0 ; 3]","S=]−∞ ; 0] ∪ [3 ; +∞[","S={0 ; 3}"],"a":1,"e":"<b>f(x)≤g(x) ⇔ x²−3x≤0 ⇔ x(x−3)≤0</b>, donc S=[0 ; 3]. Graphiquement, la parabole est sous la droite entre leurs deux points d’intersection.","fig":"compare"},{"p":"4 · Tableau de signes","q":"À partir du tableau, résoudre <b>2x²−5x+2≤0</b>.","o":["]1/2 ; 2[","[1/2 ; 2]","]−∞ ; 1/2] ∪ [2 ; +∞[","{1/2 ; 2}"],"a":1,"e":"Le trinôme est négatif entre ses racines et nul aux racines. Avec ≤0, on retient <b>[1/2 ; 2]</b>.","fig":"signs"},{"p":"4 · Tableau de signes","q":"Pour le même trinôme, résoudre <b>2x²−5x+2≥0</b>.","o":["[1/2 ; 2]","]−∞ ; 1/2] ∪ [2 ; +∞[","]−∞ ; 1/2[ ∪ ]2 ; +∞[","ℝ"],"a":1,"e":"Comme a&gt;0, le trinôme est positif à l’extérieur des racines. Avec ≥0, les racines sont incluses : <b>]−∞ ; 1/2] ∪ [2 ; +∞[</b>.","fig":"signs"},{"p":"4 · Inéquations : racine double","q":"Résoudre <b>−3(x−2)²≥0</b>.","o":["S=ℝ","S=∅","S={2}","S=]−∞ ; 2]"],"a":2,"e":"Comme (x−2)²≥0, on a −3(x−2)²≤0 pour tout x. Pour être aussi ≥0, l’expression doit être nulle : <b>x=2</b>."},{"p":"4 · Inéquations : Δ&lt;0","q":"On considère <b>P(x)=2x²−4x+5</b>. Résoudre <b>P(x)&lt;0</b>.","o":["S=ℝ","S=∅","S={1}","S=]−∞ ; 1["],"a":1,"e":"Δ=(−4)²−4×2×5=−24&lt;0 et a=2&gt;0. Donc <b>P(x)&gt;0 pour tout x</b>. L’inéquation P(x)&lt;0 n’a aucune solution."},{"p":"4 · Inéquations : factorisation","q":"Résoudre dans ℝ : <b>x²−5x+6&lt;0</b>.","o":["]−∞ ; 2[ ∪ ]3 ; +∞[","]2 ; 3[","[2 ; 3]","{2 ; 3}"],"a":1,"e":"<b>x²−5x+6=(x−2)(x−3)</b>. Comme le coefficient dominant est positif, le trinôme est négatif entre ses racines : S=]2 ; 3[."},{"p":"5 · Niveau avancé : bornes irrationnelles","q":"Résoudre <b>x²−3x+1≤0</b>.","o":["[(3−√5)/2 ; (3+√5)/2]","]−∞ ; (3−√5)/2] ∪ [(3+√5)/2 ; +∞[","] (3−√5)/2 ; (3+√5)/2 [","S=∅"],"a":0,"e":"Δ=9−4=5. Les racines sont <b>(3±√5)/2</b>. Comme a&gt;0, le trinôme est ≤0 entre les racines, bornes incluses."},{"p":"5 · Niveau avancé : paramètre","q":"Pour un réel m, on pose <b>Pₘ(x)=(x−m)²−4</b>. Résoudre <b>Pₘ(x)≤0</b>.","o":["[m−2 ; m+2]","]−∞ ; m−2] ∪ [m+2 ; +∞[","[−2 ; 2]","[m−4 ; m+4]"],"a":0,"e":"<b>(x−m)²≤4 ⇔ |x−m|≤2</b>, donc m−2≤x≤m+2. Le centre de l’intervalle se déplace avec m, sa longueur reste 4."},{"p":"5 · Niveau avancé : droite et parabole","q":"Soit <b>f(x)=x²−4x+1</b>. Pour quelle valeur de m la droite <b>y=m</b> coupe-t-elle la parabole en un seul point ?","o":["m=1","m=−3","m=3","m=−4"],"a":1,"e":"<b>f(x)=(x−2)²−3</b>. Le minimum vaut −3 au sommet. La droite horizontale y=m est tangente au sommet exactement pour <b>m=−3</b>."},{"p":"6 · Synthèse : signe avec coefficient négatif","q":"On considère <b>P(x)=−2(x+2)(x−5)</b>. Résoudre <b>P(x)≤0</b>.","o":["[−2 ; 5]","]−∞ ; −2] ∪ [5 ; +∞[","]−∞ ; −2[ ∪ ]5 ; +∞[","ℝ"],"a":1,"e":"Les racines sont −2 et 5 et le coefficient dominant est négatif. Le trinôme est donc <b>positif entre les racines et négatif à l’extérieur</b>. Avec ≤0, on inclut les racines."},{"p":"6 · Synthèse : modélisation","q":"La hauteur d’un objet est donnée par <b>h(t)=−5t²+20t+1</b> (en mètres), pour t≥0. Pour quels temps a-t-on <b>h(t)≥16</b> ?","o":["t∈[0 ; 4]","t∈[1 ; 3]","t∈]1 ; 3[","t∈[3 ; +∞["],"a":1,"e":"h(t)≥16 ⇔ −5t²+20t−15≥0 ⇔ <b>t²−4t+3≤0</b> ⇔ (t−1)(t−3)≤0. Donc <b>t∈[1 ; 3]</b>."}];

function fig(type){
if(!type)return '';
if(type==='signs')return `<div class="figure"><svg viewBox="0 0 560 150" role="img" aria-label="Tableau de signes : le trinôme est positif avant un demi, nul en un demi, négatif entre un demi et deux, nul en deux, positif après deux."><rect x="8" y="12" width="544" height="124" fill="white" stroke="#64748b"/><path d="M8 69H552M140 12V136" stroke="#64748b"/><g font-family="system-ui,sans-serif" font-size="18" text-anchor="middle" fill="#172033"><text x="74" y="48">x</text><text x="74" y="110" font-size="16">2x²−5x+2</text><text x="171" y="48">−∞</text><text x="270" y="48">1/2</text><text x="420" y="48">2</text><text x="521" y="48">+∞</text><text x="206" y="110">+</text><text x="270" y="110">0</text><text x="345" y="110">−</text><text x="420" y="110">0</text><text x="486" y="110">+</text></g></svg></div>`;
const config={roots:{x0:-1.5,x1:3.5,y0:-2,y1:5,lines:[{a:1,b:-2,c:0,color:'#167b7a'}],desc:'Courbe de f(x)=(x−1)²−1 dans un repère gradué.'},negative:{x0:-2,x1:3.5,y0:-5,y1:4,lines:[{a:-2,b:3,c:2,color:'#167b7a'}],desc:'Courbe de P(x)=−2x²+3x+2 dans un repère gradué.'},compare:{x0:-1.5,x1:4.5,y0:-5,y1:4,lines:[{a:1,b:-2,c:-3,color:'#167b7a'},{a:0,b:1,c:-3,color:'#2447d8'}],desc:'Parabole de f(x)=x²−2x−3 en vert et droite de g(x)=x−3 en bleu.'}}[type];
if(!config)return '';
const c=config,W=560,H=315,L=45,R=25,T=22,B=33;
const X=x=>L+(x-c.x0)*(W-L-R)/(c.x1-c.x0),Y=y=>H-B-(y-c.y0)*(H-T-B)/(c.y1-c.y0);
let s=`<div class="figure"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.desc}"><defs><clipPath id="plotclip"><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}"/></clipPath></defs><rect width="${W}" height="${H}" fill="white"/>`;
for(let x=Math.ceil(c.x0);x<=c.x1;x++){s+=`<path d="M${X(x)} ${T}V${H-B}" stroke="#dbe4eb"/>`;if(x!==0)s+=`<text x="${X(x)}" y="${Y(0)+20}" font-size="15" text-anchor="middle" fill="#475569">${x}</text>`}
for(let y=Math.ceil(c.y0);y<=c.y1;y++){s+=`<path d="M${L} ${Y(y)}H${W-R}" stroke="#dbe4eb"/>`;if(y!==0)s+=`<text x="${X(0)-9}" y="${Y(y)+5}" font-size="15" text-anchor="end" fill="#475569">${y}</text>`}
s+=`<path d="M${L} ${Y(0)}H${W-R+6}M${X(0)} ${H-B}V${T-6}" stroke="#334155" stroke-width="1.6"/><text x="${X(0)-8}" y="${Y(0)+19}" font-size="15" text-anchor="end">0</text><text x="${W-R+10}" y="${Y(0)+5}" font-size="16">x</text><text x="${X(0)+9}" y="${T-6}" font-size="16">y</text><g clip-path="url(#plotclip)">`;
for(const f of c.lines){let d='';for(let n=0;n<=300;n++){const x=c.x0+(c.x1-c.x0)*n/300;d+=(n?'L':'M')+X(x).toFixed(2)+' '+Y(f.a*x*x+f.b*x+f.c).toFixed(2)+' '}s+=`<path d="${d}" fill="none" stroke="${f.color}" stroke-width="3"/>`}
s+='</g>';
if(type==='compare')s+='<rect x="376" y="23" width="156" height="28" rx="5" fill="white"/><text x="386" y="43" font-size="16" fill="#167b7a">C_f</text><text x="456" y="43" font-size="16" fill="#2447d8">C_g</text>';
return s+'</svg></div>';
}
function start(){app.innerHTML=head()+`<h1>QFM — Second degré : équations, inéquations et courbes</h1><p class="subtitle">Parcours progressif niveau avancé : prérequis → discriminant → équations → lecture de courbes → tableaux de signes → inéquations → paramètres et modélisation. Toutes les résolutions se font dans ℝ.</p><div class="rule"><b>20 questions = note directe sur 20.</b><br><span class="small">Une seule réponse correcte. Correction immédiate après chaque question.</span></div><label for="name"><b>Prénom et nom</b> <span class="small">(facultatif)</span></label><input class="namebox" id="name" maxlength="80" placeholder="Ex. Lina Ben Ali"><button class="btn primary" onclick="go()">Commencer le QFM</button><div class="actions"><button class="btn whatsapp" onclick="share()">Partager sur WhatsApp</button></div>`}
function go(){student=(document.getElementById('name').value||'Élève').trim(); i=0;score=0;wrong=[];showQ()}
function showQ(){answered=false;const q=Q[i];app.innerHTML=head()+`<div class="topline"><div class="phase">${q.p}</div><div class="score">Score : ${score}/20</div></div><div class="progress"><div class="bar" style="width:${(i/20)*100}%"></div></div><div class="small">Question ${i+1} / 20</div>${fig(q.fig)}<div class="question">${q.q}</div><div class="options">${q.o.map((x,k)=>`<button class="option" onclick="ans(${k},this)"><span class="letter">${letters[k]}</span>${x}</button>`).join('')}</div><div id="fb" aria-live="polite"></div><div class="actions"><button id="next" class="btn primary hidden" onclick="next()">${i===19?'Voir mon bilan':'Question suivante'}</button></div>`}
function ans(k,b){if(answered)return;answered=true;const q=Q[i],opts=[...document.querySelectorAll('.option')];opts.forEach(x=>x.disabled=true);opts[q.a].classList.add('correct');let ok=k===q.a;if(ok){score++;document.getElementById('fb').innerHTML=`<div class="feedback good"><b>Bonne réponse.</b><br>${q.e}</div>`}else{b.classList.add('wrong');wrong.push({n:i+1,q:q.q,good:q.o[q.a],e:q.e});document.getElementById('fb').innerHTML=`<div class="feedback bad"><b>À corriger.</b><br>${q.e}</div>`}document.querySelector('.score').textContent=`Score : ${score}/20`;document.getElementById('next').classList.remove('hidden')}
function next(){if(!answered)return;if(i<19){i++;showQ()}else end()}
function end(){let level=score>=18?'Maîtrise très solide':score>=15?'Bonne maîtrise':score>=10?'Bases acquises, à consolider':'Reprise ciblée conseillée';app.innerHTML=head()+`<h1>Bilan QFM — ${escapeText(student)}</h1><div class="result">${score}/20</div><h2>${level}</h2><div class="summary"><div class="metric"><span>Bonnes réponses</span><b>${score}</b></div><div class="metric"><span>À revoir</span><b>${20-score}</b></div></div><div class="actions"><button class="btn primary" onclick="review()">Revoir mes erreurs uniquement</button><button class="btn" onclick="start()">Recommencer</button><button class="btn whatsapp" onclick="share()">Partager sur WhatsApp</button></div><div id="errs"></div>`}
function review(){const d=document.getElementById('errs');if(!wrong.length){d.innerHTML='<div class="feedback good">Aucune erreur : parcours entièrement réussi.</div>';return}d.innerHTML='<div class="errors">'+wrong.map(x=>`<div class="error"><div class="q">Question ${x.n} — ${x.q}</div><div class="corr">Réponse correcte : ${x.good}</div><div class="small">${x.e}</div></div>`).join('')+'</div>'}
function share(){const u=location.href;const t=`QFM — Second degré avancé · Première spécialité\nÉquations, inéquations, tableaux de signes et courbes — Faicel Missaoui\n${u}`;window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank','noopener,noreferrer')}
start();
</script></body></html>
