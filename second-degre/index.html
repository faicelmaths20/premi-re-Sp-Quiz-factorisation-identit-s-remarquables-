<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a5c">
<title>QFM Première Spé — Trinôme du second degré — Faicel Missaoui</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#172033;--muted:#6e7789;--navy:#102a5c;--primary:#2447d8;--primary2:#eef2ff;--teal:#167b7a;--gold:#c79a3d;--good:#18753c;--goodbg:#ecfdf3;--bad:#b42318;--badbg:#fff1f0;--border:#d9e0ea}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh} body::before{content:"FAICEL MISSAOUI";position:fixed;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-27deg);font-family:Georgia,serif;font-size:clamp(3.5rem,13vw,9rem);font-weight:700;letter-spacing:.08em;color:#102a5c;opacity:.022;white-space:nowrap;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:920px;margin:auto;padding:16px}.card{background:rgba(255,255,255,.988);border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:0 12px 36px rgba(15,23,42,.07)}
.fm-header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:15px;padding-bottom:13px;margin-bottom:16px;border-bottom:1.5px solid rgba(16,42,92,.78)}.fm-logo{width:76px;height:76px;object-fit:contain}.fm-identity{min-width:0;border-left:1px solid rgba(16,42,92,.35);padding-left:15px}.fm-name{font-family:Georgia,serif;font-size:clamp(1.3rem,3.2vw,1.75rem);line-height:1.05;font-weight:700;color:var(--navy)}.fm-title{font-family:Georgia,serif;font-size:.82rem;color:#7b8495;margin-top:5px}.fm-right{display:flex;flex-direction:column;align-items:flex-end;gap:7px}.fm-phone{font-family:Georgia,serif;color:var(--navy);font-weight:700;font-size:1rem}.fm-phone small{font-family:system-ui;font-size:.69rem;color:#8c95a5;margin-right:5px}.pill{padding:6px 10px;border-radius:999px;background:var(--primary2);color:#253b9d;font-weight:800;font-size:.82rem}
h1{font-size:clamp(1.55rem,4.5vw,2.25rem);line-height:1.15;margin:.25rem 0 .6rem;color:#15213b}.subtitle{color:var(--muted);line-height:1.5}.rule{border-left:4px solid var(--teal);padding:10px 12px;background:#f5fbfb;border-radius:10px;margin:14px 0}.small{font-size:.92rem;color:var(--muted)}.namebox{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:12px;font-size:1rem;margin:7px 0 12px;background:white}.btn{width:100%;border:1px solid var(--border);border-radius:13px;padding:13px 14px;font-size:1rem;font-weight:800;cursor:pointer;background:white;color:var(--text)}.btn.primary{background:var(--primary);color:white;border-color:var(--primary)}.btn.whatsapp{background:#eafff2;border-color:#9de2b5;color:#126b35}.btn:disabled{cursor:default;opacity:.88}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.phase{font-weight:850;color:#3446a7}.score{font-weight:900}.progress{height:10px;background:#e8ecf4;border-radius:999px;overflow:hidden;margin:10px 0 18px}.bar{height:100%;background:linear-gradient(90deg,var(--teal),#3678df);transition:width .25s}.question{font-size:1.28rem;font-weight:820;line-height:1.45;margin:16px 0}.options{display:grid;gap:10px}.option{width:100%;text-align:left;border:1px solid var(--border);border-radius:13px;padding:13px 14px;background:white;font-size:1rem;cursor:pointer;line-height:1.35}.option:hover:not(:disabled){border-color:var(--primary);transform:translateY(-1px)}.option.correct{background:var(--goodbg);border-color:#70d796;color:#135c2c}.option.wrong{background:var(--badbg);border-color:#f3a6a0;color:#7a271a}.letter{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#eef1f6;font-weight:900;margin-right:8px}.feedback{margin-top:14px;padding:13px 14px;border-radius:12px;line-height:1.5}.feedback.good{background:var(--goodbg);border:1px solid #9be6b5;color:#135c2c}.feedback.bad{background:var(--badbg);border:1px solid #f2b6b1;color:#7a271a}.actions{display:grid;gap:9px;margin-top:13px}.result{font-size:3.5rem;font-weight:950;letter-spacing:-.04em;margin:8px 0;color:var(--navy)}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}.metric{border:1px solid var(--border);border-radius:12px;padding:12px;background:#fafbfc}.metric b{display:block;font-size:1.35rem}.errors{display:grid;gap:10px;margin-top:16px}.error{border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff}.error .q{font-weight:800}.error .corr{color:var(--good);font-weight:800;margin-top:5px}.figure{margin:12px auto 15px;max-width:560px}.figure svg{width:100%;height:auto;border:1px solid var(--border);border-radius:13px;background:#fff}.footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:12px}.footer strong{font-family:Georgia,serif;color:var(--navy)}.hidden{display:none}
@media(max-width:640px){.wrap{padding:8px}.card{padding:14px;border-radius:15px}.fm-header{grid-template-columns:58px 1fr;gap:10px}.fm-logo{width:58px;height:58px}.fm-identity{padding-left:10px}.fm-name{font-size:1.18rem}.fm-title{font-size:.72rem}.fm-right{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;width:100%;padding-top:3px}.summary{grid-template-columns:1fr}.question{font-size:1.15rem}.option{padding:12px}.result{font-size:3rem}}
</style>
</head><body><div class="wrap"><main class="card" id="app"></main><div class="footer"><strong>Faicel Missaoui</strong> — Professeur agrégé de mathématiques</div></div>
<script>
const Q=[{"p": "1 · Lire une fonction", "q": "On considère <b>f(x)=x²−4x+3</b>. Quelle est la valeur de <b>f(2)</b> ?", "o": ["−1", "1", "3", "−3"], "a": 0, "e": "f(2)=2²−4×2+3=4−8+3=−1."}, {"p": "1 · Lire une fonction", "q": "Pour <b>f(x)=x²−4x+3</b>, quel point appartient à la courbe C<sub>f</sub> ?", "o": ["A(2 ; 1)", "B(2 ; −1)", "C(0 ; 2)", "D(1 ; 1)"], "a": 1, "e": "Un point M(x ; y) appartient à C_f si y=f(x). Comme f(2)=−1, B(2 ; −1) appartient à C_f.", "fig": "parabola"}, {"p": "1 · Vocabulaire", "q": "La représentation graphique d’une fonction <b>f(x)=ax²+bx+c</b> avec a≠0 est…", "o": ["une droite", "une hyperbole", "une parabole", "un cercle"], "a": 2, "e": "Une fonction polynôme du second degré a pour représentation graphique une parabole."}, {"p": "1 · Coefficients", "q": "Dans <b>f(x)=x²−4x+3</b>, le coefficient <b>a</b> vaut…", "o": ["−4", "3", "1", "0"], "a": 2, "e": "On compare à ax²+bx+c : ici a=1, b=−4 et c=3."}, {"p": "2 · Orientation", "q": "Si <b>a&gt;0</b>, la parabole est…", "o": ["ouverte vers le haut", "ouverte vers le bas", "toujours au-dessus de l’axe des abscisses", "toujours croissante"], "a": 0, "e": "Le signe de a détermine l’orientation : a&gt;0 implique une parabole ouverte vers le haut.", "fig": "orientation"}, {"p": "2 · Orientation", "q": "Si <b>a&lt;0</b>, le sommet de la parabole correspond à…", "o": ["un minimum", "un maximum", "une racine", "l’origine du repère"], "a": 1, "e": "Pour a&lt;0, la parabole est ouverte vers le bas : son sommet est un maximum."}, {"p": "2 · Erreur classique", "q": "Quelle affirmation est correcte ?", "o": ["Si a&gt;0 alors f(x)&gt;0 pour tout x.", "Le signe de a donne l’orientation de la parabole, pas à lui seul le signe de f(x).", "Si a&lt;0 alors f n’a aucune racine.", "Le signe de a donne directement les solutions de f(x)=0."], "a": 1, "e": "Le signe de a indique l’orientation. Il ne suffit pas pour connaître le signe de f(x)."}, {"p": "3 · Sommet", "q": "La forme canonique <b>f(x)=(x−2)²−1</b> permet de lire directement le sommet…", "o": ["S(−2 ; −1)", "S(2 ; 1)", "S(2 ; −1)", "S(−1 ; 2)"], "a": 2, "e": "Dans a(x−α)²+β, le sommet est S(α ; β). Ici α=2 et β=−1.", "fig": "parabola"}, {"p": "3 · Axe", "q": "Pour <b>f(x)=(x−2)²−1</b>, l’axe de symétrie est…", "o": ["y=2", "x=−2", "x=2", "y=−1"], "a": 2, "e": "L’axe de symétrie est x=α. Ici α=2."}, {"p": "3 · Calcul de α", "q": "Pour <b>f(x)=x²−4x+3</b>, on utilise α=−b/(2a). Quelle est la valeur de α ?", "o": ["−2", "2", "4", "−4"], "a": 1, "e": "a=1 et b=−4, donc α=−(−4)/(2×1)=2."}, {"p": "3 · Calcul de β", "q": "Pour <b>f(x)=x²−4x+3</b> et α=2, β vaut…", "o": ["β=f(2)=−1", "β=f(2)=1", "β=2", "β=3"], "a": 0, "e": "β=f(α)=f(2)=−1. Le sommet est donc S(2 ; −1)."}, {"p": "4 · Forme canonique", "q": "Quelle est la forme canonique de <b>f(x)=x²−4x+3</b> ?", "o": ["(x−2)²−1", "(x+2)²−1", "(x−2)²+1", "(x−1)²−2"], "a": 0, "e": "x²−4x+3=(x²−4x+4)−1=(x−2)²−1."}, {"p": "4 · Variations", "q": "Pour <b>f(x)=(x−2)²−1</b>, quel est le bon tableau de variation ?", "o": ["f croît puis décroît, avec maximum en 2", "f décroît puis croît, avec minimum en 2", "f est croissante sur ℝ", "f est décroissante sur ℝ"], "a": 1, "e": "Comme a=1&gt;0, f décroît jusqu’à x=2 puis croît. Le minimum vaut −1.", "fig": "variationUp"}, {"p": "4 · Application", "q": "Soit <b>g(x)=−2x²+8x−5</b>. Quelle est l’abscisse α du sommet ?", "o": ["−2", "2", "4", "−4"], "a": 1, "e": "α=−b/(2a)=−8/[2×(−2)]=2."}, {"p": "4 · Application", "q": "Pour <b>g(x)=−2x²+8x−5</b>, on trouve α=2. Quelle est l’ordonnée β du sommet ?", "o": ["−3", "3", "5", "−5"], "a": 1, "e": "β=g(2)=−2×4+16−5=3. Comme a&lt;0, S(2 ; 3) est un maximum."}, {"p": "5 · Résolution graphique", "q": "Pour <b>f(x)=x²−4x+3=(x−1)(x−3)</b>, quelles sont les solutions de f(x)=0 ?", "o": ["x=−1 ou x=−3", "x=1 ou x=3", "x=0 ou x=4", "x=2 uniquement"], "a": 1, "e": "Les intersections avec l’axe des abscisses ont pour abscisses 1 et 3.", "fig": "roots"}, {"p": "5 · Résolution", "q": "Résoudre <b>f(x)=3</b> pour f(x)=x²−4x+3.", "o": ["x=−1 ou x=5", "x=1 ou x=3", "x=0 ou x=4", "x=2"], "a": 2, "e": "x²−4x+3=3 ⇔ x²−4x=0 ⇔ x(x−4)=0. Donc x=0 ou x=4."}, {"p": "5 · Inéquation", "q": "Pour <b>f(x)=x²−4x+3</b>, résoudre f(x)≤0.", "o": ["]−∞;1]∪[3;+∞[", "[1;3]", "]1;3[", "ℝ"], "a": 1, "e": "La parabole est ouverte vers le haut et se situe sous ou sur l’axe des abscisses entre ses deux racines : x∈[1;3].", "fig": "roots"}, {"p": "5 · Sans discriminant", "q": "Résoudre <b>(x−2)²−1=0</b> sans utiliser le discriminant.", "o": ["x=−1 ou x=1", "x=1 ou x=3", "x=2 uniquement", "x=0 ou x=4"], "a": 1, "e": "(x−2)²=1 ⇔ x−2=1 ou x−2=−1. Donc x=3 ou x=1."}, {"p": "6 · Synthèse", "q": "Soit <b>h(x)=2x²−8x+5=2(x−2)²−3</b>. Résoudre h(x)=−1.", "o": ["x=0 ou x=4", "x=1 ou x=3", "x=2", "aucune solution"], "a": 1, "e": "2(x−2)²−3=−1 ⇔ (x−2)²=1, donc x=1 ou x=3."}];
const letters=['A','B','C','D']; let i=0,score=0,answered=false,wrong=[]; let student='';
const app=document.getElementById('app');
function head(){return `<div class="fm-header"><img class="fm-logo" src="../logo-fm.svg" alt="FM"><div class="fm-identity"><div class="fm-name">Faicel Missaoui</div><div class="fm-title">Professeur agrégé de mathématiques</div></div><div class="fm-right"><div class="fm-phone"><small>Téléphone</small>52266771</div><div class="pill">Première spécialité</div></div></div>`}
function fig(type){if(!type)return''; if(type==='parabola'||type==='roots')return `<div class="figure"><svg viewBox="0 0 520 255"><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#dbe4eb"/></pattern></defs><rect width="520" height="255" fill="url(#g)"/><line x1="45" y1="185" x2="490" y2="185" stroke="#334155" stroke-width="2"/><line x1="95" y1="230" x2="95" y2="20" stroke="#334155" stroke-width="2"/><line x1="255" y1="25" x2="255" y2="225" stroke="#5d8cb5" stroke-width="2" stroke-dasharray="7 7"/><path d="M95 65 C145 110 185 205 255 215 C325 205 365 110 415 65" fill="none" stroke="#167b7a" stroke-width="4"/><circle cx="175" cy="185" r="5" fill="#167b7a"/><circle cx="335" cy="185" r="5" fill="#167b7a"/><circle cx="255" cy="215" r="5" fill="#b42318"/><text x="263" y="212" font-size="16" fill="#102a5c">S(2 ; −1)</text><text x="263" y="45" font-size="15" fill="#5d8cb5">x=2</text><text x="171" y="204" font-size="14">1</text><text x="331" y="204" font-size="14">3</text></svg></div>`; if(type==='orientation')return `<div class="figure"><svg viewBox="0 0 520 220"><defs><pattern id="g2" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#dbe4eb"/></pattern></defs><rect width="520" height="220" fill="url(#g2)"/><line x1="35" y1="145" x2="490" y2="145" stroke="#334155" stroke-width="2"/><line x1="110" y1="200" x2="110" y2="20" stroke="#334155" stroke-width="2"/><path d="M120 50 C175 115 215 175 275 180 C335 175 375 115 430 50" fill="none" stroke="#167b7a" stroke-width="4"/><text x="235" y="205" font-size="15" fill="#102a5c">a &gt; 0</text></svg></div>`; if(type==='variationUp')return `<div class="figure"><svg viewBox="0 0 520 175"><rect x="20" y="18" width="480" height="135" rx="8" fill="#fff" stroke="#cbd5e1"/><line x1="20" y1="65" x2="500" y2="65" stroke="#64748b"/><line x1="105" y1="18" x2="105" y2="153" stroke="#64748b"/><text x="55" y="49" font-size="18">x</text><text x="150" y="49" font-size="18">−∞</text><text x="293" y="49" font-size="18">2</text><text x="435" y="49" font-size="18">+∞</text><text x="45" y="112" font-size="18">f(x)</text><text x="143" y="91" font-size="18">+∞</text><text x="298" y="135" font-size="18">−1</text><text x="430" y="91" font-size="18">+∞</text><path d="M190 88 L282 128" stroke="#167b7a" stroke-width="4"/><path d="M330 128 L420 88" stroke="#167b7a" stroke-width="4"/><path d="M282 128 l-13 -1 l7 -11 z" fill="#167b7a"/><path d="M420 88 l-13 2 l6 11 z" fill="#167b7a"/></svg></div>`; return''}
function start(){app.innerHTML=head()+`<h1>QFM — Trinôme du second degré</h1><p class="subtitle">Quiz progressif : courbe → sommet → forme canonique → variations → résolutions.</p><div class="rule"><b>20 questions = note directe sur 20.</b><br><span class="small">Une seule réponse correcte. Correction immédiate après chaque question.</span></div><label><b>Prénom et nom</b></label><input class="namebox" id="name" placeholder="Ex. Lina Ben Ali"><button class="btn primary" onclick="go()">Commencer le QFM</button>`}
function go(){student=(document.getElementById('name').value||'Élève').trim(); i=0;score=0;wrong=[];showQ()}
function showQ(){answered=false;const q=Q[i];app.innerHTML=head()+`<div class="topline"><div class="phase">${q.p}</div><div class="score">Score : ${score}/20</div></div><div class="progress"><div class="bar" style="width:${(i/20)*100}%"></div></div><div class="small">Question ${i+1} / 20</div>${fig(q.fig)}<div class="question">${q.q}</div><div class="options">${q.o.map((x,k)=>`<button class="option" onclick="ans(${k},this)"><span class="letter">${letters[k]}</span>${x}</button>`).join('')}</div><div id="fb"></div><div class="actions"><button id="next" class="btn primary hidden" onclick="next()">${i===19?'Voir mon bilan':'Question suivante'}</button></div>`}
function ans(k,b){if(answered)return;answered=true;const q=Q[i],opts=[...document.querySelectorAll('.option')];opts.forEach(x=>x.disabled=true);opts[q.a].classList.add('correct');let ok=k===q.a;if(ok){score++;document.getElementById('fb').innerHTML=`<div class="feedback good"><b>Bonne réponse.</b><br>${q.e}</div>`}else{b.classList.add('wrong');wrong.push({n:i+1,q:q.q,good:q.o[q.a],e:q.e});document.getElementById('fb').innerHTML=`<div class="feedback bad"><b>À corriger.</b><br>${q.e}</div>`}document.getElementById('next').classList.remove('hidden')}
function next(){if(i<19){i++;showQ()}else end()}
function end(){let level=score>=18?'Maîtrise très solide':score>=15?'Bonne maîtrise':score>=10?'Bases acquises, à consolider':'Reprise ciblée conseillée';app.innerHTML=head()+`<h1>Bilan QFM — ${student}</h1><div class="result">${score}/20</div><h2>${level}</h2><div class="summary"><div class="metric"><span>Bonnes réponses</span><b>${score}</b></div><div class="metric"><span>À revoir</span><b>${20-score}</b></div></div><div class="actions"><button class="btn primary" onclick="review()">Revoir mes erreurs uniquement</button><button class="btn" onclick="start()">Recommencer</button><button class="btn whatsapp" onclick="share()">Partager sur WhatsApp</button></div><div id="errs"></div>`}
function review(){const d=document.getElementById('errs');if(!wrong.length){d.innerHTML='<div class="feedback good">Aucune erreur : parcours entièrement réussi.</div>';return}d.innerHTML='<div class="errors">'+wrong.map(x=>`<div class="error"><div class="q">Question ${x.n} — ${x.q}</div><div class="corr">Réponse correcte : ${x.good}</div><div class="small">${x.e}</div></div>`).join('')+'</div>'}
function share(){const u=location.href;const t=`QFM — Trinôme du second degré · Première spécialité\nQuiz progressif de Faicel Missaoui\n${u}`;window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}
start();
</script></body></html>
