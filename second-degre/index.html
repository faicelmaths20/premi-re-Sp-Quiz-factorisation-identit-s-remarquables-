<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102a5c">
<title>QFM Première Spé — Second degré — Faicel Missaoui</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#172033;--muted:#6e7789;--navy:#102a5c;--primary:#2447d8;--primary2:#eef2ff;--good:#18753c;--goodbg:#ecfdf3;--bad:#b42318;--badbg:#fff1f0;--border:#d9e0ea}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:"FAICEL MISSAOUI";position:fixed;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-27deg);font-family:Georgia,'Times New Roman',serif;font-size:clamp(3.5rem,13vw,9rem);font-weight:700;letter-spacing:.08em;color:#102a5c;opacity:.025;white-space:nowrap;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:920px;margin:auto;padding:16px}.card{background:rgba(255,255,255,.985);border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:0 12px 36px rgba(15,23,42,.07)}
.fm-header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:15px;padding-bottom:13px;margin-bottom:16px;border-bottom:1.5px solid rgba(16,42,92,.78)}
.fm-logo{width:76px;height:76px;object-fit:contain;display:block;filter:drop-shadow(0 2px 4px rgba(16,42,92,.08))}.fm-identity{min-width:0;border-left:1px solid rgba(16,42,92,.35);padding-left:15px}
.fm-name{font-family:Georgia,'Times New Roman',serif;font-size:clamp(1.3rem,3.2vw,1.75rem);line-height:1.05;font-weight:700;color:var(--navy);letter-spacing:.01em;white-space:nowrap}.fm-title{font-family:Georgia,'Times New Roman',serif;font-size:.82rem;color:#7b8495;margin-top:5px;letter-spacing:.015em}
.fm-right{display:flex;flex-direction:column;align-items:flex-end;gap:7px;text-align:right}.fm-phone{font-family:Georgia,'Times New Roman',serif;color:var(--navy);font-weight:700;font-size:1rem;text-decoration:none;white-space:nowrap}.fm-phone small{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:.69rem;font-weight:700;color:#8c95a5;letter-spacing:.06em;text-transform:uppercase;margin-right:5px}.pill{padding:6px 10px;border-radius:999px;background:var(--primary2);color:#253b9d;font-weight:800;font-size:.82rem;white-space:nowrap}
h1{font-size:clamp(1.55rem,4.5vw,2.25rem);line-height:1.15;margin:.25rem 0 .6rem;color:#15213b}h2{margin:.2rem 0 .6rem}.subtitle{color:var(--muted);line-height:1.5}.rule{border-left:4px solid var(--primary);padding:10px 12px;background:#f8faff;border-radius:10px;margin:14px 0}.small{font-size:.92rem;color:var(--muted)}
.namebox{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:12px;font-size:1rem;margin:7px 0 12px;background:white}.btn{width:100%;border:1px solid var(--border);border-radius:13px;padding:13px 14px;font-size:1rem;font-weight:800;cursor:pointer;background:white;color:var(--text)}.btn.primary{background:var(--primary);color:white;border-color:var(--primary)}.btn.secondary{background:#fff}.btn.whatsapp{background:#eafff2;border-color:#9de2b5;color:#126b35}.btn:disabled{cursor:default;opacity:.85}
.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.phase{font-weight:850;color:#3446a7}.score{font-weight:900}.progress{height:10px;background:#e8ecf4;border-radius:999px;overflow:hidden;margin:10px 0 18px}.bar{height:100%;background:linear-gradient(90deg,#102a5c,#3678df);transition:width .25s ease}.question{font-size:1.28rem;font-weight:820;line-height:1.45;margin:16px 0}.options{display:grid;gap:10px}.option{width:100%;text-align:left;border:1px solid var(--border);border-radius:13px;padding:13px 14px;background:white;font-size:1rem;cursor:pointer;line-height:1.35}.option:hover:not(:disabled){border-color:var(--primary);transform:translateY(-1px)}.option.correct{background:var(--goodbg);border-color:#70d796;color:#135c2c}.option.wrong{background:var(--badbg);border-color:#f3a6a0;color:#7a271a}.letter{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#eef1f6;font-weight:900;margin-right:8px}
.feedback{margin-top:14px;padding:13px 14px;border-radius:12px;line-height:1.5}.feedback.good{background:var(--goodbg);border:1px solid #9be6b5;color:#135c2c}.feedback.bad{background:var(--badbg);border:1px solid #f2b6b1;color:#7a271a}.actions{display:grid;gap:9px;margin-top:13px}.result{font-size:3.5rem;font-weight:950;letter-spacing:-.04em;margin:8px 0;color:var(--navy)}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}.metric{border:1px solid var(--border);border-radius:12px;padding:12px;background:#fafbfc}.metric b{display:block;font-size:1.35rem}.errors{display:grid;gap:10px;margin-top:16px}.error{border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff}.error .q{font-weight:800}.error .corr{color:var(--good);font-weight:800;margin-top:5px}.footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:12px}.footer strong{font-family:Georgia,'Times New Roman',serif;color:var(--navy)}.hidden{display:none}
@media(max-width:640px){.wrap{padding:8px}.card{padding:14px;border-radius:15px}.fm-header{grid-template-columns:58px 1fr;gap:10px}.fm-logo{width:58px;height:58px}.fm-identity{padding-left:10px}.fm-name{font-size:1.18rem;white-space:normal}.fm-title{font-size:.72rem}.fm-right{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;width:100%;padding-top:3px}.summary{grid-template-columns:1fr}.question{font-size:1.15rem}.option{padding:12px}.result{font-size:3rem}}
</style>
</head>
<body>
<div class="wrap"><main class="card" id="app"></main><div class="footer"><strong>Faicel Missaoui</strong> — Professeur agrégé de mathématiques</div></div>
<script>
const Q=[
{p:"1 · Prérequis",q:"Une fonction polynôme du second degré s'écrit <b>f(x)=ax²+bx+c</b>. Quelle condition est indispensable ?",o:["a=0","a≠0","b≠0","c≠0"],a:1,e:"Pour que le polynôme soit bien de degré 2, le coefficient de x² doit être non nul : a≠0. Si a=0, le terme en x² disparaît."},
{p:"1 · Prérequis",q:"Quelle identité remarquable est correcte ?",o:["(u+v)²=u²+v²","(u+v)²=u²+2uv+v²","(u+v)²=u²+uv+v²","(u+v)²=2u²+2v²"],a:1,e:"On doit conserver le double produit : (u+v)²=u²+2uv+v². Erreur classique : oublier le terme 2uv."},
{p:"1 · Reconnaître les formes",q:"Laquelle est une <b>forme canonique</b> ?",o:["2x²−12x+10","2(x−3)²−8","2(x−1)(x−5)","2x(x−6)+10"],a:1,e:"Une forme canonique est de la forme a(x−α)²+β. Ici, 2(x−3)²−8 permet de lire directement α=3 et β=−8."},
{p:"2 · Forme canonique",q:"Quelle est la forme canonique de <b>x²+6x+5</b> ?",o:["(x+3)²−4","(x−3)²−4","(x+3)²+4","(x−3)²+4"],a:0,e:"x²+6x+5=x²+2·3·x+9−9+5=(x+3)²−4. Erreur classique : changer le signe dans la parenthèse."},
{p:"2 · Forme canonique",q:"Quelle est la forme canonique de <b>2x²−8x+3</b> ?",o:["2(x−2)²−5","2(x−4)²+3","2(x−2)²+5","2(x+2)²−5"],a:0,e:"2x²−8x+3=2(x²−4x)+3=2[(x−2)²−4]+3=2(x−2)²−5."},
{p:"2 · Passer d'une forme à l'autre",q:"Développer <b>−2(x+1)²+8</b> donne :",o:["−2x²−4x+6","−2x²+4x+6","−2x²−2x+8","2x²+4x+6"],a:0,e:"(x+1)²=x²+2x+1, donc −2(x+1)²+8=−2x²−4x−2+8=−2x²−4x+6."},
{p:"3 · Factorisation",q:"Factoriser au maximum <b>3x²−12x</b>.",o:["3x(x−4)","3(x²−4)","x(3x−12x)","3x(x−12)"],a:0,e:"Le facteur commun maximal est 3x : 3x²−12x=3x(x−4). Réflexe : chercher d'abord un facteur commun."},
{p:"3 · Factorisation",q:"Factoriser <b>4x²−25</b>.",o:["(4x−5)(4x+5)","(2x−5)(2x+5)","(2x−5)²","(4x−25)(x+1)"],a:1,e:"4x²−25=(2x)²−5². On utilise u²−v²=(u−v)(u+v), d'où (2x−5)(2x+5)."},
{p:"3 · Factorisation",q:"Factoriser <b>x²−10x+25</b>.",o:["(x−5)²","(x+5)²","(x−25)(x+1)","x(x−10)+25"],a:0,e:"x²−10x+25=x²−2·5·x+5²=(x−5)². Le signe du double produit impose le signe −."},
{p:"3 · Factorisation",q:"Factoriser complètement <b>2(x−3)²−8</b>.",o:["2(x−5)(x−1)","2(x−7)(x+1)","(2x−5)(x−1)","2(x−3)(x−4)"],a:0,e:"2(x−3)²−8=2[(x−3)²−4]=2[(x−3)²−2²]=2(x−5)(x−1)."},
{p:"4 · Équations",q:"Résoudre <b>(x−4)(x+2)=0</b>.",o:["x=4 seulement","x=−2 seulement","x=4 ou x=−2","x=2 ou x=−4"],a:2,e:"Un produit est nul si et seulement si l'un de ses facteurs est nul : x−4=0 ou x+2=0, donc x=4 ou x=−2."},
{p:"4 · Équations",q:"Résoudre <b>3(x−2)²=0</b>.",o:["x=2","x=−2","x=2 ou x=−2","Aucune solution"],a:0,e:"Comme 3≠0, on doit avoir (x−2)²=0, donc x−2=0 et x=2. Il s'agit d'une racine double."},
{p:"4 · Équations",q:"Résoudre dans ℝ <b>x²=49</b>.",o:["x=7","x=−7","x=7 ou x=−7","x=49"],a:2,e:"x²=49=7², donc x=7 ou x=−7. Erreur classique : oublier la solution négative."},
{p:"4 · Équations",q:"Résoudre dans ℝ <b>(x+1)²=9</b>.",o:["x=2 ou x=−4","x=3 ou x=−3","x=8 ou x=−10","x=2 seulement"],a:0,e:"(x+1)²=3² donne x+1=3 ou x+1=−3, donc x=2 ou x=−4."},
{p:"4 · Équations",q:"Résoudre <b>x²+6x+5=0</b>.",o:["x=1 ou x=5","x=−1 ou x=−5","x=−3 seulement","Aucune solution"],a:1,e:"x²+6x+5=(x+1)(x+5). Le produit est nul pour x=−1 ou x=−5."},
{p:"4 · Équations",q:"Résoudre <b>2x²−8x+6=0</b>.",o:["x=1 ou x=3","x=−1 ou x=−3","x=2 ou x=6","x=3 seulement"],a:0,e:"2x²−8x+6=2(x²−4x+3)=2(x−1)(x−3). Donc x=1 ou x=3."},
{p:"5 · Erreurs classiques",q:"Quelle démarche est <b>fausse</b> pour résoudre <b>(x−2)(x+5)=7</b> ?",o:["Développer puis résoudre l'équation obtenue","Ramener tout dans un même membre","Écrire x−2=0 ou x+5=0","Transformer l'équation si cela conduit à une forme factorisable"],a:2,e:"La règle du produit nul ne s'applique que lorsque le produit est égal à 0. Ici, (x−2)(x+5)=7 : on ne peut pas annuler séparément les facteurs."},
{p:"5 · Erreurs classiques",q:"Que peut-on dire de l'équation <b>x²+4x+8=0</b> dans ℝ ?",o:["Elle a deux solutions réelles","Elle a une solution réelle double","Elle n'a aucune solution réelle","Ses solutions sont −2 et 2"],a:2,e:"x²+4x+8=(x+2)²+4. Or (x+2)²≥0, donc (x+2)²+4>0 pour tout réel x : aucune solution réelle."},
{p:"6 · Synthèse",q:"On considère <b>f(x)=−2(x−1)(x−5)</b>. Quelle forme canonique est correcte ?",o:["−2(x−3)²+8","−2(x+3)²+8","2(x−3)²−8","−2(x−2)²+6"],a:0,e:"Les racines 1 et 5 sont symétriques par rapport à x=3. En développant puis complétant le carré, on obtient f(x)=−2(x−3)²+8."},
{p:"6 · Synthèse",q:"Résoudre <b>2(x−3)²−8=10</b>.",o:["x=0 ou x=6","x=−3 ou x=3","x=1 ou x=5","x=6 seulement"],a:0,e:"2(x−3)²−8=10 ⇔ 2(x−3)²=18 ⇔ (x−3)²=9. Donc x−3=3 ou x−3=−3, d'où x=6 ou x=0."}
];
let i=0,score=0,student="",answers=[];const app=document.getElementById('app');const letters=['A','B','C','D'];
function brandHeader(label=''){return `<div class="fm-header"><img class="fm-logo" src="../logo-fm.svg" alt="Logo FM"><div class="fm-identity"><div class="fm-name">Faicel Missaoui</div><div class="fm-title">Professeur agrégé de mathématiques</div></div><div class="fm-right"><a class="fm-phone" href="tel:52266771"><small>Tél.</small>52266771</a>${label?`<span class="pill">${label}</span>`:''}</div></div>`}
function shareQuiz(){const txt='QFM Première Spé — Second degré : forme canonique, factorisation et équations — Faicel Missaoui : '+location.href;window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}
function start(){app.innerHTML=`${brandHeader('Première Spé · 20 questions · /20')}<h1>Second degré : formes, factorisation et équations</h1><p class="subtitle">Quiz progressif : prérequis, forme canonique, passages entre les formes, factorisation, résolution d'équations, erreurs classiques et synthèse.</p><div class="rule"><b>Réflexe :</b> avant de résoudre une équation du second degré, chercher la forme la plus efficace : factorisée, canonique ou développée.</div><label for="student"><b>Prénom de l'élève</b> <span class="small">(facultatif)</span></label><input id="student" class="namebox" placeholder="Ex. Lina"><div class="actions"><button class="btn primary" id="begin">Commencer</button><button class="btn whatsapp" id="share">Partager ce quiz sur WhatsApp</button></div>`;document.getElementById('begin').onclick=begin;document.getElementById('share').onclick=shareQuiz}
function begin(){student=document.getElementById('student').value.trim();i=0;score=0;answers=[];render()}
function render(){const q=Q[i];const pct=(i/Q.length)*100;app.innerHTML=`${brandHeader('Question '+(i+1)+'/20')}<div class="topline"><span class="phase">${q.p}</span><span class="score">Score : ${score}/20</span></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="question">${q.q}</div><div class="options" id="opts">${q.o.map((x,k)=>`<button class="option" data-k="${k}"><span class="letter">${letters[k]}</span>${x}</button>`).join('')}</div><div id="fb"></div><div class="actions" id="nextbox"></div>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>choose(Number(b.dataset.k)))}
function choose(k){const q=Q[i];const btns=[...document.querySelectorAll('.option')];btns.forEach(b=>b.disabled=true);btns[q.a].classList.add('correct');if(k!==q.a)btns[k].classList.add('wrong');const ok=k===q.a;if(ok)score++;answers.push({q:q.q.replace(/<[^>]+>/g,''),chosen:q.o[k],correct:q.o[q.a],ok,e:q.e});const fb=document.getElementById('fb');fb.className='feedback '+(ok?'good':'bad');fb.innerHTML=`<b>${ok?'Bonne réponse.':'À corriger.'}</b><br>${q.e}${ok?'':`<br><b>Réponse attendue :</b> ${q.o[q.a]}`}`;const box=document.getElementById('nextbox');box.innerHTML=`<button class="btn primary" id="next">${i===Q.length-1?'Voir mon bilan':'Question suivante'}</button>`;document.getElementById('next').onclick=()=>{i++;if(i<Q.length)render();else finish()}}
function finish(){const pct=Math.round(score/20*100);let msg=score>=18?'Maîtrise très solide':score>=15?'Bon niveau':score>=12?'Bases acquises, quelques automatismes à renforcer':score>=8?'Révisions ciblées nécessaires':'Reprendre les formes et les équations pas à pas';app.innerHTML=`${brandHeader('Bilan')}<h2>${student?student+', ':''}résultat du quiz</h2><div class="result">${score}/20</div><p class="subtitle"><b>${msg}</b></p><div class="summary"><div class="metric"><span class="small">Réussite</span><b>${pct}%</b></div><div class="metric"><span class="small">Erreurs</span><b>${20-score}</b></div></div><div class="actions"><button class="btn primary" id="review">Revoir uniquement mes erreurs</button><button class="btn secondary" id="restart">Recommencer</button><button class="btn whatsapp" id="shareScore">Partager mon score sur WhatsApp</button></div><div id="errors" class="errors hidden"></div>`;document.getElementById('restart').onclick=start;document.getElementById('review').onclick=review;document.getElementById('shareScore').onclick=shareScore}
function review(){const e=document.getElementById('errors');const wrong=answers.filter(x=>!x.ok);e.classList.remove('hidden');e.innerHTML=wrong.length?wrong.map((x,n)=>`<div class="error"><div class="q">${n+1}. ${x.q}</div><div>Ta réponse : ${x.chosen}</div><div class="corr">Correction : ${x.correct}</div><div class="small">${x.e}</div></div>`).join(''):`<div class="feedback good"><b>20/20 :</b> aucune erreur à revoir.</div>`;e.scrollIntoView({behavior:'smooth',block:'start'})}
function shareScore(){const who=student?student+' : ':'';const txt=`${who}${score}/20 au QFM Première Spé — Second degré — Faicel Missaoui. ${location.href}`;window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}
start();
</script>
</body>
</html>
