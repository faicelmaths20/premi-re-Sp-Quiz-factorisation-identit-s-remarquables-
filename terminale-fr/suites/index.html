<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QFM · Suites numériques · Terminale spécialité</title>
<style>
:root{--navy:#002147;--gold:#b69b5b;--paper:#f4f6fa;--ink:#172b44}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 system-ui,sans-serif}main{max-width:860px;margin:24px auto;padding:0 18px}header{display:flex;align-items:center;gap:18px;border-bottom:3px solid var(--gold);padding:16px 0 22px}header img{width:82px;height:82px}header strong{font-size:22px;color:var(--navy)}header small{display:block;font-size:12px}h1{font-size:30px;line-height:1.2;color:var(--navy);margin:24px 0 8px}h2{font-size:23px;line-height:1.45;margin:12px 0 22px}h3{font-size:18px}p{margin:10px 0}button,a.share{font:inherit;min-height:48px;border-radius:10px;cursor:pointer}button{border:1px solid #bac6d6;background:white;color:var(--navy);padding:12px 18px}button:hover:not(:disabled){border-color:var(--navy);background:#edf2fa}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{cursor:default}button.primary{background:var(--navy);color:white;border-color:var(--navy)}.muted{font-size:14px;color:#536477}.card{background:white;border:1px solid #e0e5ec;border-radius:18px;padding:28px;margin:20px 0;box-shadow:0 6px 25px #00214708}.row{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.tag{color:var(--navy);font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}progress{display:block;width:100%;height:9px;margin:16px 0 25px;accent-color:var(--gold)}.answers{display:grid;gap:12px}.answer{display:flex;gap:12px;text-align:left;align-items:center;width:100%}.letter{display:inline-grid;place-items:center;flex-shrink:0;border:1px solid #b8c5d4;border-radius:7px;width:30px;height:30px;font-size:14px;font-weight:700}.answer.correct{background:#edf7f1;border:2px solid #217247;color:#175237}.answer.wrong{background:#fff0ef;border:2px solid #ad3d35;color:#842f28}.feedback{border-left:4px solid var(--gold);background:#faf7ef;padding:15px 18px;margin-top:20px}.actions{margin-top:24px}.example{padding:13px 17px;background:#f2f5fa;border-radius:9px;margin:15px 0;font-size:15px}details{margin:14px 0}summary{cursor:pointer;color:var(--navy);font-weight:600;min-height:32px}table{border-collapse:collapse;width:100%;font-size:15px}td,th{padding:11px 8px;border-bottom:1px solid #dbe1e9;text-align:left}th:last-child,td:last-child{text-align:right}.score{font-size:46px;font-weight:750;color:var(--navy)}.share{display:inline-block;text-decoration:none;background:#eef3f8;padding:12px 18px;color:var(--navy);border:1px solid #bac6d6}footer{padding:20px 0 30px;text-align:center;font-size:12px;color:#536477}.math{font-family:Georgia,serif;font-size:1.1em}sub,sup{line-height:0}svg.plot{width:100%;max-width:440px;height:auto;display:block;margin:10px auto} [hidden]{display:none!important}@media(max-width:550px){main{margin-top:10px;padding:0 12px}.card{padding:20px 16px}header{gap:12px}header img{width:64px;height:64px}header strong{font-size:19px}h1{font-size:25px}h2{font-size:20px}}
</style></head>
<body><main>
<header><img src="../../logo-fm.svg" alt="Logo FM"><div><strong>Faicel MISSAOUI</strong><small>Professeur agrégé de mathématiques</small></div></header>
<h1>QFM · Suites numériques</h1><p class="muted">Terminale spécialité · 20 questions · Une seule réponse par question</p>
<section class="card" id="quiz" aria-label="Quiz">
<div class="row"><span class="tag" id="theme"></span><span class="muted" id="position"></span></div>
<progress id="progress" max="20" value="0" aria-label="Questions terminées"></progress>
<div id="context"></div><h2 id="question" tabindex="-1"></h2>
<div id="answers" class="answers" role="group" aria-labelledby="question"></div>
<div id="feedback" class="feedback" role="status" hidden></div>
<div class="actions row"><span class="muted" id="scoreLive"></span><button class="primary" id="next" hidden>Question suivante →</button></div>
</section>
<section class="card" id="results" hidden aria-label="Résultats"><h2 id="resultTitle" tabindex="-1">Votre résultat</h2><div class="score" id="score"></div><p id="resultText"></p><table><thead><tr><th>Notion</th><th>Réussites</th></tr></thead><tbody id="breakdown"></tbody></table><div id="review"></div><div class="actions row"><button id="retry" class="primary">Reprendre mes erreurs</button><button id="restart">Recommencer les 20 questions</button></div></section>
<div class="row"><button id="copy">Copier le lien du QFM</button><a class="share" id="whatsapp" target="_blank" rel="noopener">Partager sur WhatsApp</a></div><p class="muted" id="copyStatus" role="status"></p>
<footer>FM · Faicel MISSAOUI · Mathématiques</footer></main>
<script>
'use strict';
const Q = [
{t:'Termes et suites usuelles',q:'On pose uₙ = 3n + 2 pour n ≥ 0. Que vaut u₄ ?',o:['6','12','14','17'],a:2,e:'Le rang est n = 4 : u₄ = 3 × 4 + 2 = 14. Le terme u₀ vaut 2 ; u₄ est donc le cinquième terme lorsque la suite commence au rang 0.'},
{t:'Termes et suites usuelles',q:'La suite est définie par u₀ = 2 et uₙ₊₁ = 3uₙ − 1. Que vaut u₂ ?',o:['5','11','17','14'],a:3,e:'On calcule successivement u₁ = 3 × 2 − 1 = 5, puis u₂ = 3 × 5 − 1 = 14. Dans une relation de récurrence, on utilise le terme précédent.'},
{t:'Termes et suites usuelles',q:'Une suite arithmétique vérifie u₃ = 11 et sa raison est 4. Que vaut u₈ ?',o:['31','43','27','55'],a:0,e:'Du rang 3 au rang 8, il y a 8 − 3 = 5 passages. On ajoute donc cinq fois 4 : u₈ = 11 + 5 × 4 = 31.'},
{t:'Termes et suites usuelles',q:'Une suite géométrique vérifie v₁ = 5 et sa raison est 2. Quelle est son expression pour n ≥ 1 ?',o:['vₙ = 5 × 2ⁿ','vₙ = 5 × 2ⁿ⁻¹','vₙ = 5 + 2(n − 1)','vₙ = 2 × 5ⁿ⁻¹'],a:1,e:'Du rang 1 au rang n, il y a n − 1 multiplications par 2. Ainsi vₙ = 5 × 2ⁿ⁻¹. Vérifier n = 1 permet de retrouver le terme initial 5.'},
{t:'Termes et suites usuelles',q:'Une quantité diminue de 8 % à chaque étape. Quelle est la raison de la suite géométrique associée ?',o:['−0,08','1,08','0,08','0,92'],a:3,e:'Diminuer de 8 % revient à conserver 92 % de la quantité : le coefficient multiplicateur est 1 − 8/100 = 0,92.'},
{t:'Nombre de termes et sommes',q:'Combien de termes contient u₃ + u₄ + ⋯ + u₁₂ ?',o:['9','12','10','13'],a:2,e:'Les deux extrémités sont comptées : 12 − 3 + 1 = 10 termes. La différence des rangs compte les passages, pas les termes.'},
{t:'Nombre de termes et sommes',c:'<div class="example"><strong>Exemple.</strong> Dans 4 + 7 + ⋯ + 31, chaque passage ajoute 3. De 4 à 31 : (31 − 4)/3 = 9 passages, donc 10 termes.<br><strong>Formule.</strong> Pour des termes consécutifs d’une suite arithmétique de raison r ≠ 0 : N = (dernier − premier)/r + 1.</div>',q:'Combien de termes contient 7 + 11 + ⋯ + 79 ?',o:['18','19','20','21'],a:1,e:'La raison est 4. Il y a (79 − 7)/4 = 18 passages et donc 19 termes. Il n’est pas nécessaire de connaître les rangs.'},
{t:'Nombre de termes et sommes',q:'Quelle est la somme 7 + 11 + ⋯ + 79, qui contient 19 termes ?',o:['817','1 634','774','86'],a:0,e:'Somme arithmétique = nombre de termes × moyenne du premier et du dernier. Ici S = 19 × (7 + 79)/2 = 19 × 43 = 817.'},
{t:'Nombre de termes et sommes',c:'<div class="example"><strong>Exemple.</strong> Dans 2 + 6 + 18 + 54, on multiplie par 3. Comme 54/2 = 27 = 3³, il y a 3 passages et 4 termes.<br><strong>Relation.</strong> Pour N termes géométriques consécutifs : dernier = premier × q<sup>N−1</sup>.</div>',q:'Combien de termes contient 3 + 6 + 12 + ⋯ + 96 ?',o:['5','7','32','6'],a:3,e:'La raison est 2 et 96/3 = 32 = 2⁵. Cinq multiplications séparent le premier et le dernier terme : il y a donc 6 termes.'},
{t:'Nombre de termes et sommes',q:'Quelle est la somme 3 + 6 + 12 + ⋯ + 96, qui contient 6 termes ?',o:['93','192','189','297'],a:2,e:'Pour q ≠ 1, S = premier × (1 − qᴺ)/(1 − q). Ici S = 3 × (1 − 2⁶)/(1 − 2) = 3 × 63 = 189. L’exposant est le nombre de termes, soit 6.'},
{t:'Monotonie et bornes',q:'Quelle affirmation caractérise une suite croissante sur ℕ ?',o:['Pour tout n, uₙ₊₁ ≥ uₙ.','Pour tout n, uₙ₊₁ > uₙ.','Pour tout n, uₙ ≥ 0.','Pour au moins un n, uₙ₊₁ ≥ uₙ.'],a:0,e:'« Croissante » autorise l’égalité : uₙ₊₁ ≥ uₙ pour tout n. « Strictement croissante » exige > à chaque rang. Une suite constante est croissante, mais pas strictement croissante.'},
{t:'Monotonie et bornes',q:'On pose uₙ = n(n − 1), pour n ≥ 0. Quelle est la conclusion la plus précise sur ℕ ?',o:['Strictement croissante.','Croissante, mais pas strictement croissante.','Décroissante.','Ni croissante ni décroissante.'],a:1,e:'uₙ₊₁ − uₙ = (n + 1)n − n(n − 1) = 2n ≥ 0. La suite est croissante. Cependant u₀ = u₁ = 0 : elle n’est pas strictement croissante sur ℕ. Elle l’est à partir du rang 1.'},
{t:'Monotonie et bornes',q:'La suite vₙ = −3 × (1/2)ⁿ, pour n ≥ 0, est…',o:['Strictement décroissante.','Constante.','Non monotone.','Strictement croissante.'],a:3,e:'Ses premiers termes sont −3 ; −1,5 ; −0,75. Pour tout n, vₙ₊₁ − vₙ = (3/2) × (1/2)ⁿ > 0. Avec un premier terme négatif, une raison comprise entre 0 et 1 ne donne pas une suite décroissante.'},
{t:'Monotonie et bornes',q:'Pour uₙ = 4 − 3/(n + 1), n ≥ 0, quel encadrement est valable à tous les rangs ?',o:['4 ≤ uₙ ≤ 7','0 ≤ uₙ ≤ 1','1 ≤ uₙ < 4','1 < uₙ < 4'],a:2,e:'Comme 0 < 3/(n + 1) ≤ 3, on obtient 1 ≤ uₙ < 4. Le minorant 1 est atteint au rang 0. Le nombre 4 est un majorant, même s’il n’est jamais atteint. La suite est bornée.'},
{t:'Monotonie et bornes',q:'On pose wₙ = 2 + (−1)ⁿ, pour n ≥ 0. Quelle affirmation est vraie ?',o:['Elle est bornée et non monotone.','Elle est croissante et majorée.','Elle est décroissante et minorée.','Elle n’est pas bornée.'],a:0,e:'Les termes alternent entre 3 et 1 : 3, 1, 3, 1, … Ainsi 1 ≤ wₙ ≤ 3, mais elle diminue puis augmente. Être bornée n’impose pas d’être monotone.'},
{t:'Raisonnement par récurrence',q:'On veut prouver une propriété P(n) pour tout entier n ≥ 1. Quelle démarche est correcte ?',o:['Vérifier P(1), P(2) et P(3).','Supposer P(n) vraie pour tout n.','Prouver seulement que P(n) entraîne P(n + 1).','Vérifier P(1), puis prouver P(n) ⇒ P(n + 1) pour un entier n ≥ 1 quelconque.'],a:3,e:'L’initialisation établit le premier cas. L’hérédité transmet la propriété d’un rang quelconque au suivant. Il faut ensuite conclure : par récurrence, P(n) est vraie pour tout n ≥ 1.'},
{t:'Raisonnement par récurrence',q:'On pose u₀ = 1 et uₙ₊₁ = uₙ/2 + 3. Pour prouver uₙ < 6 par récurrence, quelle est l’hypothèse de récurrence ?',o:['uₙ₊₁ < 6.','uₙ < 6, pour un entier n ≥ 0 fixé.','uₙ < 6 pour tous les entiers n, sans preuve.','u₀ < 6.'],a:1,e:'À l’étape d’hérédité, on fixe un entier n ≥ 0 et on suppose uₙ < 6. On doit alors démontrer uₙ₊₁ < 6. L’inégalité u₀ < 6 correspond à l’initialisation.'},
{t:'Raisonnement par récurrence',q:'Avec uₙ₊₁ = uₙ/2 + 3 et l’hypothèse uₙ < 6, quelle ligne prouve l’hérédité ?',o:['uₙ₊₁ < 6 car c’est ce qu’on veut prouver.','uₙ₊₁ < 6/2 = 3.','uₙ₊₁ = uₙ/2 + 3 < 6/2 + 3 = 6.','uₙ₊₁ > 6/2 + 3 = 6.'],a:2,e:'Diviser par 2, qui est positif, conserve le sens de l’inégalité. Ajouter 3 le conserve également. Avec l’initialisation u₀ = 1 < 6, la récurrence permet de conclure uₙ < 6 pour tout n ≥ 0.'},
{t:'Raisonnement par récurrence',q:'On sait que uₙ < 6 et uₙ₊₁ = uₙ/2 + 3. Que peut-on en déduire ?',o:['La suite est strictement croissante et majorée par 6.','La suite est strictement décroissante et majorée par 6.','La suite est constante et égale à 6.','La suite n’est pas majorée.'],a:0,e:'uₙ₊₁ − uₙ = 3 − uₙ/2 = (6 − uₙ)/2 > 0. La suite est donc strictement croissante. L’inégalité uₙ < 6 donne aussi un majorant : 6.'},
{t:'Raisonnement par récurrence',q:'On pose a₀ = 0 et aₙ₊₁ = aₙ + 2n + 1. En supposant aₙ = n², quelle égalité termine l’hérédité ?',o:['aₙ₊₁ = n² + 1.','aₙ₊₁ = (n + 1)² + 1.','aₙ₊₁ = 2(n + 1)².','aₙ₊₁ = n² + 2n + 1 = (n + 1)².'],a:3,e:'On remplace aₙ par n² grâce à l’hypothèse de récurrence, puis on reconnaît une identité remarquable. Comme a₀ = 0 = 0², on conclut par récurrence que aₙ = n² pour tout n ≥ 0.'}
];
const $=id=>document.getElementById(id);
let order=Q.map((_,i)=>i), at=0, responses={}, original=null, retryMode=false;
function correctCount(ids,answers){return ids.filter(i=>answers[i]===Q[i].a).length;}
function render(){const i=order[at],q=Q[i];$('quiz').hidden=false;$('results').hidden=true;$('theme').textContent=q.t;$('position').textContent=(retryMode?'Reprise · ':'')+(at+1)+' / '+order.length;$('progress').max=order.length;$('progress').value=at;$('context').innerHTML=q.c||'';$('question').textContent=q.q;$('answers').replaceChildren();$('feedback').hidden=true;$('next').hidden=true;$('scoreLive').textContent='';q.o.forEach((option,k)=>{const b=document.createElement('button');b.className='answer';const letter=document.createElement('span');letter.className='letter';letter.textContent='ABCD'[k];const text=document.createElement('span');text.textContent=option;b.append(letter,text);b.onclick=()=>answer(k);$('answers').append(b);});$('question').focus();}
function answer(k){const i=order[at],q=Q[i];if(Object.hasOwn(responses,i))return;responses[i]=k;Array.from($('answers').children).forEach((b,j)=>{b.disabled=true;if(j===q.a){b.classList.add('correct');b.append(document.createTextNode(' ✓'));}else if(j===k){b.classList.add('wrong');b.append(document.createTextNode(' ✕'));}});$('feedback').hidden=false;$('feedback').textContent=(k===q.a?'Bonne réponse. ':'La bonne réponse est '+ 'ABCD'[q.a]+'. ')+q.e;$('progress').value=at+1;$('scoreLive').textContent=correctCount(order,responses)+' bonne(s) réponse(s) sur '+(at+1);$('next').textContent=at===order.length-1?'Voir mon bilan':'Question suivante →';$('next').hidden=false;}
function finish(){if(!retryMode)original={...responses};$('quiz').hidden=true;$('results').hidden=false;const score=correctCount(order,responses);$('score').textContent=score+' / '+order.length;$('resultTitle').textContent=retryMode?'Bilan de la reprise':'Votre résultat';$('resultText').textContent=retryMode?'Score initial : '+correctCount(Q.map((_,i)=>i),original)+' / 20. Le score de cette reprise est présenté ci-dessus.':(score===20?'Toutes les réponses sont correctes.':'Vous pouvez reprendre les questions manquées après avoir relu les explications.');$('breakdown').replaceChildren();[...new Set(order.map(i=>Q[i].t))].forEach(t=>{const ids=order.filter(i=>Q[i].t===t);const tr=document.createElement('tr');[t,correctCount(ids,responses)+' / '+ids.length].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td);});$('breakdown').append(tr);});$('review').replaceChildren();order.filter(i=>responses[i]!==Q[i].a).forEach(i=>{const d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('p');s.textContent='Question '+(i+1)+' · '+Q[i].q;p.textContent='Réponse : '+Q[i].o[Q[i].a]+'. '+Q[i].e;d.append(s,p);$('review').append(d);});$('retry').hidden=score===order.length;$('resultTitle').focus();}
$('next').onclick=()=>{if(at+1<order.length){at++;render();}else finish();};
$('retry').onclick=()=>{order=order.filter(i=>responses[i]!==Q[i].a);responses={};at=0;retryMode=true;render();};
$('restart').onclick=()=>{order=Q.map((_,i)=>i);at=0;responses={};original=null;retryMode=false;render();};
const shareURL='https://faicelmaths20.github.io/premi-re-Sp-Quiz-factorisation-identit-s-remarquables-/terminale-fr/suites/';
$('whatsapp').href='https://wa.me/?text='+encodeURIComponent('QFM · Suites numériques · Terminale spécialité — '+shareURL);
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(shareURL);$('copyStatus').textContent='Lien copié.';}catch{$('copyStatus').textContent=shareURL;}};
render();
</script></body></html>
