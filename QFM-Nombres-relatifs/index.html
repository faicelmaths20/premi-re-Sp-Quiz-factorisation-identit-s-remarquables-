<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183b56"><title>QFM — Nombres relatifs — Faicel Missaoui</title>
<style>
:root{--navy:#183b56;--blue:#2f80a8;--teal:#16877a;--mint:#e7f7f3;--coral:#d95f57;--rose:#fff0ed;--ink:#20303c;--muted:#64748b;--line:#dbe7ee;--paper:#f5f8fb}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 8% 0,#dff2f8 0,transparent 30rem),radial-gradient(circle at 92% 90%,#e0f5ef 0,transparent 30rem),var(--paper);min-height:100vh}.wrap{width:min(850px,calc(100% - 26px));margin:auto;padding:18px 0}.header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:15px;padding:12px 17px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 35px #183b5612}.brand{display:flex;align-items:center;gap:11px}.logo{width:55px;height:55px;object-fit:contain}.brand strong,.brand small,.contact span{display:block}.brand strong{font-family:Georgia,serif;color:var(--navy);font-size:1.18rem}.brand small,.contact span,.center small{color:var(--muted);font-size:.7rem}.center{text-align:center}.center b{display:block;font:700 1.45rem Georgia,serif;color:var(--navy);letter-spacing:.08em}.contact{text-align:right}.contact strong{color:var(--navy)}.stage{margin:34px 0}.progresscopy{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin-bottom:8px}.bar{height:8px;border-radius:99px;background:#dfe9ee;overflow:hidden;margin-bottom:18px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));transition:.3s}.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:25px;padding:32px;box-shadow:0 20px 60px #183b5615;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--blue),var(--teal))}.badge{display:inline-block;padding:6px 11px;border-radius:99px;background:#e8f4fa;color:var(--blue);font-size:.72rem;font-weight:850;text-transform:uppercase;letter-spacing:.08em}h1,h2{font-family:Georgia,serif;color:var(--navy)}h1{font-size:clamp(1.8rem,5vw,2.8rem);margin:18px 0 8px}h2{font-size:clamp(1.45rem,4vw,2rem);margin:18px 0 22px}.lead{color:var(--muted);line-height:1.6}.skills{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.skills span{background:var(--mint);color:#116b61;border-radius:99px;padding:8px 11px;font-size:.78rem}.name{display:block;font-weight:750;font-size:.82rem;margin-top:20px}.name input{display:block;width:100%;height:48px;margin-top:7px;padding:0 13px;border:1px solid var(--line);border-radius:12px;font-size:1rem}.btn{width:100%;border:0;border-radius:13px;padding:14px 18px;margin-top:18px;background:linear-gradient(100deg,var(--navy),var(--blue));color:#fff;font-weight:850;font-size:1rem;cursor:pointer}.btn:disabled{opacity:.4;cursor:default}.choices{display:grid;grid-template-columns:1fr 1fr;gap:11px}.choice{display:grid;grid-template-columns:31px 1fr auto;align-items:center;gap:10px;min-height:60px;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;text-align:left;font-size:1rem}.choice:hover{border-color:#8bbbd0}.choice.selected{border-color:var(--blue);background:#eff8fc}.choice.right{border-color:var(--teal);background:var(--mint);color:#116b61}.choice.wrong{border-color:var(--coral);background:var(--rose);color:#973e38}.letter{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:#edf2f5;color:var(--navy);font-weight:850;font-size:.76rem}.feedback{margin-top:16px;padding:15px 17px;border-radius:14px;border-left:4px solid;line-height:1.55;font-size:.9rem}.good{background:var(--mint);border-color:var(--teal);color:#116b61}.bad{background:var(--rose);border-color:var(--coral);color:#973e38}.axis{width:100%;height:105px;margin:-5px 0 17px}.result{text-align:center}.score{width:145px;height:145px;margin:12px auto 22px;display:grid;place-content:center;border-radius:50%;background:var(--mint);border:12px solid #d2eee8;box-shadow:inset 0 0 0 3px var(--teal)}.score strong{font:700 3rem Georgia,serif;color:var(--navy);line-height:1}.score span{color:var(--muted)}.review{text-align:left;display:grid;gap:9px;margin-top:20px}.error{padding:13px;border:1px solid var(--line);border-radius:12px}.error b{color:var(--navy)}.error p{margin:5px 0;font-size:.84rem}.corr{color:var(--teal)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.whatsapp{background:#20b862}.footer{text-align:center;color:var(--muted);font-size:.72rem;padding:8px}@media(max-width:640px){.header{grid-template-columns:1fr auto}.center{display:none}.logo{width:46px;height:46px}.brand small{font-size:.61rem}.contact span{display:none}.stage{margin:23px 0}.card{padding:23px 17px;border-radius:19px}.choices{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.choice{min-height:55px}}
</style></head><body><div class="wrap"><header class="header"><div class="brand"><img class="logo" src="../rentree-troisieme/logo-fm-officiel.jpg" alt="Logo officiel FM"><div><strong>Faicel Missaoui</strong><small>Professeur agrégé de mathématiques</small></div></div><div class="center"><b>QFM</b><small>Nombres relatifs • Troisième</small></div><div class="contact"><span>Téléphone</span><strong>52 266 771</strong></div></header><main class="stage" id="app"></main><div class="footer">QFM • Faicel Missaoui • Révisions de Quatrième pour réussir en Troisième</div></div>
<script>
const Q=[
{l:"Repérer",q:"Quel nombre est l’opposé de −7 ?",o:["−7","+7","0","1/7"],a:1,e:"Deux nombres opposés ont la même distance à zéro et des signes contraires."},
{l:"Comparer",q:"Quelle comparaison est correcte ?",o:["−8 > −3","−8 = −3","−8 < −3","−8 > 0"],a:2,e:"Sur une droite graduée, −8 est placé à gauche de −3 : il est donc plus petit.",f:1},
{l:"Ordonner",q:"Quel rangement est dans l’ordre croissant ?",o:["5 < 0 < −2 < −7","−7 < −2 < 0 < 5","−2 < −7 < 0 < 5","0 < −2 < 5 < −7"],a:1,e:"On lit la droite graduée de gauche à droite : les nombres augmentent."},
{l:"Additionner",q:"Calculer : −8 + 3",o:["−11","−5","+5","+11"],a:1,e:"Signes différents : 8 − 3 = 5 et le nombre le plus éloigné de zéro est −8. Résultat : −5."},
{l:"Additionner",q:"Calculer : −6 + (−4)",o:["−10","−2","+2","+10"],a:0,e:"Même signe : on additionne 6 + 4 = 10 et on garde le signe négatif."},
{l:"Soustraire",q:"Compléter : 7 − 10 = 7 + …",o:["10","−10","−7","3"],a:1,e:"Soustraire 10 revient à ajouter son opposé, c’est-à-dire −10."},
{l:"Soustraire",q:"Calculer : −5 − (−2)",o:["−7","−3","+3","+7"],a:1,e:"On transforme : −5 − (−2) = −5 + 2 = −3."},
{l:"Multiplier",q:"Calculer : (−4) × (−3)",o:["−12","−7","+7","+12"],a:3,e:"Un produit de deux nombres de même signe est positif, puis 4 × 3 = 12."},
{l:"Diviser",q:"Calculer : (−20) ÷ 5",o:["−4","+4","−15","+15"],a:0,e:"Les signes sont différents : le quotient est négatif. Comme 20 ÷ 5 = 4, le résultat est −4."},
{l:"Priorités",q:"Calculer : 7 − 3 × (−4)",o:["−16","−5","+19","+40"],a:2,e:"La multiplication est prioritaire : 3 × (−4) = −12, puis 7 − (−12) = 19."}];
let i=0,chosen=null,checked=false,score=0,name="",answers=[];const app=document.getElementById("app"),L=["A","B","C","D"];
function axis(){return `<svg class="axis" viewBox="0 0 650 105" role="img" aria-label="Droite graduée"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#183b56"/></marker></defs><line x1="28" y1="54" x2="625" y2="54" stroke="#183b56" stroke-width="3" marker-end="url(#a)"/>${[-9,-8,-7,-6,-5,-4,-3,-2,-1,0].map((n,k)=>`<line x1="${40+k*62}" y1="45" x2="${40+k*62}" y2="63" stroke="#183b56"/><text x="${40+k*62}" y="82" text-anchor="middle" fill="#64748b" font-size="13">${n}</text>`).join("")}<text x="430" y="25" fill="#16877a" font-size="13" font-weight="700">les nombres augmentent →</text></svg>`}
function start(){app.innerHTML=`<section class="card"><span class="badge">Parcours progressif</span><h1>Révisions des nombres relatifs</h1><p class="lead">10 questions avec correction immédiate et bilan final. Lis chaque explication, même lorsque ta réponse est juste.</p><div class="skills"><span>Repérer et comparer</span><span>Additionner et soustraire</span><span>Multiplier et diviser</span><span>Respecter les priorités</span></div><label class="name">Prénom et nom (facultatif)<input id="student" placeholder="Écris ton nom"></label><button class="btn" onclick="begin()">Commencer le QFM</button></section>`}
function begin(){name=document.getElementById("student").value.trim();i=0;chosen=null;checked=false;score=0;answers=[];render()}
function render(){const q=Q[i];app.innerHTML=`<div class="progresscopy"><span>Question ${i+1} sur ${Q.length}</span><b>Score : ${score}</b></div><div class="bar"><i style="width:${((i+1)/Q.length)*100}%"></i></div><section class="card"><span class="badge">${q.l}</span><h2>${q.q}</h2>${q.f?axis():""}<div class="choices">${q.o.map((o,n)=>`<button class="choice ${chosen===n?"selected":""} ${checked&&n===q.a?"right":""} ${checked&&n===chosen&&n!==q.a?"wrong":""}" onclick="choose(${n})"><span class="letter">${L[n]}</span><span>${o}</span><b>${checked&&n===q.a?"✓":checked&&n===chosen&&n!==q.a?"✕":""}</b></button>`).join("")}</div>${checked?`<div class="feedback ${chosen===q.a?"good":"bad"}"><b>${chosen===q.a?"Bonne réponse !":`La bonne réponse était ${L[q.a]}.`}</b><br>${q.e}</div>`:""}<button class="btn" ${chosen===null?"disabled":""} onclick="${checked?"next()":"verify()"}">${checked?(i===Q.length-1?"Voir mon résultat":"Question suivante"):"Valider ma réponse"}</button></section>`}
function choose(n){if(!checked){chosen=n;render()}}function verify(){if(chosen===null)return;checked=true;answers[i]=chosen;if(chosen===Q[i].a)score++;render()}function next(){if(i===Q.length-1)return result();i++;chosen=null;checked=false;render();scrollTo({top:0,behavior:"smooth"})}
function result(){const msg=score>=9?"Excellent : les nombres relatifs sont maîtrisés !":score>=7?"Très bien : encore une petite révision et ce sera parfait.":score>=5?"Bon début : relis surtout les corrections de tes erreurs.":"Reprends le mini-cours, puis tente à nouveau le QFM.";const errors=Q.map((q,n)=>({q,n,c:answers[n]})).filter(x=>x.c!==x.q.a);app.innerHTML=`<section class="card result"><span class="badge">Bilan du QFM</span><div class="score"><strong>${score}</strong><span>/ 10</span></div><h2>${name?`Bravo ${name} !`:"Quiz terminé !"}</h2><p class="lead">${msg}</p>${errors.length?`<div class="review">${errors.map(x=>`<article class="error"><b>Question ${x.n+1}</b><p>${x.q.q}</p><p class="corr">Bonne réponse : ${x.q.o[x.q.a]}</p><p>${x.q.e}</p></article>`).join("")}</div>`:`<div class="feedback good">Parcours sans faute : bravo !</div>`}<div class="actions"><button class="btn" onclick="start()">↻ Recommencer</button><button class="btn whatsapp" onclick="share()">Partager sur WhatsApp</button></div></section>`;scrollTo({top:0,behavior:"smooth"})}
function share(){const who=name?` (${name})`:"",text=`J’ai obtenu ${score}/10 au QFM « Nombres relatifs »${who}. À toi de jouer : ${location.href}`;open(`https://wa.me/?text=${encodeURIComponent(text)}`,"_blank","noopener")};start();
</script></body></html>
