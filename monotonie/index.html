<style>

.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.phase{font-weight:850;color:#3446a7}.score{font-weight:900}.progress{height:10px;background:#e8ecf4;border-radius:999px;overflow:hidden;margin:10px 0 18px}.bar{height:100%;background:linear-gradient(90deg,#102a5c,#3678df);transition:width .25s ease}.question{font-size:1.28rem;font-weight:820;line-height:1.45;margin:16px 0}.options{display:grid;gap:10px}.option{width:100%;text-align:left;border:1px solid var(--border);border-radius:13px;padding:13px 14px;background:white;font-size:1rem;cursor:pointer;line-height:1.35}.option:hover:not(:disabled){border-color:var(--primary);transform:translateY(-1px)}.option.correct{background:var(--goodbg);border-color:#70d796;color:#135c2c}.option.wrong{background:var(--badbg);border-color:#f3a6a0;color:#7a271a}.letter{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#eef1f6;font-weight:900;margin-right:8px}

<div class="wrap"><main class="card" id="app"></main><div class="footer"><strong>Faicel Missaoui</strong> — Professeur agrégé de mathématiques</div></div>
<script>
const Q=[
{p:"1 · Prérequis",q:"On suppose <i>a</i> &lt; <i>b</i>. Quel est le signe de <i>b−a</i> ?",o:["b−a&lt;0","b−a&gt;0","b−a=0","On ne peut pas savoir"],a:1,e:"Comme b est plus grand que a, b−a est strictement positif.",t:"Ne pas confondre b−a avec a−b.",v:"order"},
{p:"1 · Prérequis",q:"Toujours avec <i>a</i> &lt; <i>b</i>, quel est le signe de <i>a−b</i> ?",o:["a−b&lt;0","a−b&gt;0","a−b=0","Il dépend de f"],a:0,e:"L’inégalité a&lt;b équivaut à a−b&lt;0.",t:"Ce signe ne dépend pas de la fonction étudiée."},
{p:"2 · Observation",q:"Sur cette figure, <i>a</i> &lt; <i>b</i> et la courbe monte. Quelle comparaison lit-on ?",o:["f(a)&gt;f(b)","f(a)=f(b)","f(a)&lt;f(b)","a=b"],a:2,e:"En allant de a vers b, les images augmentent : l’ordre est conservé.",t:"Une figure aide à conjecturer ; la définition rigoureuse doit porter sur tous les couples.",v:"up"},
{p:"2 · Définition",q:"Quelle proposition définit une fonction <b>croissante</b> sur un intervalle <i>I</i> ?",o:["Pour certains a&lt;b, f(a)≤f(b)","Pour tous a,b∈I, a&lt;b ⇒ f(a)≤f(b)","Pour tous a&lt;b, f(a)≥f(b)","Pour tout a∈I, f(a)≥0"],a:1,e:"Une fonction croissante conserve l’ordre pour tous les couples a&lt;b de I.",t:"Croissante ne signifie pas positive : variation et signe sont deux notions différentes."},
{p:"2 · Définition",q:"Si <i>f</i> est décroissante sur <i>I</i> et si <i>a</i> &lt; <i>b</i>, alors…",o:["f(a)≤f(b)","f(a)≥f(b)","f(a)&lt;0","f(b)&gt;0"],a:1,e:"Une fonction décroissante inverse l’ordre : a&lt;b entraîne f(a)≥f(b).",t:"Décroissante ne signifie pas que les images sont négatives.",v:"down"},
{p:"2 · Définition",q:"Au sens large, une fonction constante sur un intervalle est…",o:["Uniquement croissante","Uniquement décroissante","À la fois croissante et décroissante","Ni croissante ni décroissante"],a:2,e:"Pour une fonction constante, f(a)=f(b) : les deux inégalités larges ≤ et ≥ sont vérifiées.",t:"Elle n’est toutefois ni strictement croissante ni strictement décroissante."},
{p:"2 · Définition",q:"Si <i>f</i> est <b>strictement croissante</b> et si <i>a</i> &lt; <i>b</i>, alors…",o:["f(a)&lt;f(b)","f(a)≤f(b) seulement","f(a)&gt;f(b)","f(a)=f(b)"],a:0,e:"La croissance stricte conserve strictement l’ordre : a&lt;b entraîne f(a)&lt;f(b).",t:"Le symbole ≤ correspond à la croissance au sens large ; ici l’inégalité est stricte."},
{p:"3 · Différence",q:"On sait que <i>a</i> &lt; <i>b</i> et que <i>f</i> est croissante. Quel est le signe de <i>f(a)−f(b)</i> ?",o:["Strictement positif","Positif ou nul","Négatif ou nul","Toujours nul"],a:2,e:"La croissance donne f(a)≤f(b), donc f(a)−f(b)≤0.",t:"Le mot croissante ne rend pas cette différence positive : l’ordre des termes compte."},
{p:"3 · Différence",q:"On sait que <i>a</i> &lt; <i>b</i> et que <i>f</i> est décroissante. Alors <i>f(a)−f(b)</i> est…",o:["Négatif ou nul","Positif ou nul","Toujours strictement négatif","Impossible à déterminer"],a:1,e:"La décroissance donne f(a)≥f(b), donc f(a)−f(b)≥0.",t:"Il faut d’abord écrire la comparaison des images, puis soustraire."},
{p:"4 · Taux d’accroissement",q:"Pour <i>a</i> ≠ <i>b</i>, quelle égalité est correcte ?",o:["(f(b)−f(a))/(b−a)=(f(a)−f(b))/(a−b)","(f(b)−f(a))/(b−a)=(f(a)−f(b))/(b−a)","(f(b)−f(a))/(a−b)=0","Les deux écritures sont toujours opposées"],a:0,e:"Changer simultanément le signe du numérateur et du dénominateur ne change pas le quotient.",t:"Si l’on inverse seulement le numérateur ou seulement le dénominateur, le quotient change de signe.",v:"secant"},
{p:"4 · Taux d’accroissement",q:"Quel critère caractérise une fonction croissante sur <i>I</i> ?",o:["Le taux est ≥0 pour tous a≠b dans I","Le taux est ≤0 pour tous a≠b dans I","Le taux est positif pour un seul couple","Le taux vaut toujours 1"],a:0,e:"Une fonction est croissante exactement lorsque tous ses taux d’accroissement sont positifs ou nuls.",t:"Le mot essentiel est tous : un seul taux positif ne suffit pas."},
{p:"4 · Raisonnement",q:"Pour un seul couple avec <i>a</i>&lt;<i>b</i>, on calcule un taux positif. Que peut-on conclure ?",o:["La fonction est croissante sur tout son domaine","Seulement que f(b)&gt;f(a) pour ce couple","La fonction est décroissante","La fonction est affine"],a:1,e:"Ce calcul compare uniquement les deux images choisies. Il ne prouve aucune monotonie sur tout l’intervalle.",t:"Ne pas généraliser une propriété globale à partir d’un seul exemple."},
{p:"4 · Taux d’accroissement",q:"Si le taux d’accroissement vaut 0 pour tous les couples distincts de <i>I</i>, alors <i>f</i> est…",o:["Strictement croissante","Strictement décroissante","Constante sur I","Positive sur I"],a:2,e:"Un taux nul donne f(b)−f(a)=0 pour tous a≠b, donc toutes les images sont égales.",t:"Un taux nul renseigne sur la variation, pas sur le signe des images."},
{p:"5 · Application affine",q:"Soit <i>f(x)=3x−2</i>. Pour a&lt;b, on a f(a)−f(b)=3(a−b)&lt;0. Conclusion ?",o:["f est strictement décroissante sur ℝ","f est constante","f est strictement croissante sur ℝ","On ne peut rien conclure"],a:2,e:"f(a)&lt;f(b) lorsque a&lt;b : l’ordre est strictement conservé.",t:"Le signe négatif de f(a)−f(b) correspond ici à une fonction croissante."},
{p:"5 · Application affine",q:"Pour <i>g(x)=−2x+5</i>, le taux d’accroissement vaut −2. Donc…",o:["g est strictement croissante sur ℝ","g est strictement décroissante sur ℝ","g est positive sur ℝ","g est constante"],a:1,e:"Le taux est strictement négatif pour tous les couples distincts : g est strictement décroissante.",t:"Le taux −2 ne signifie pas que toutes les valeurs de g sont négatives."},
{p:"6 · Fonction carré",q:"Pour <i>h(x)=x²</i> et a≠b, que vaut <i>(h(a)−h(b))/(a−b)</i> ?",o:["a−b","a+b","(a+b)²","1"],a:1,e:"a²−b²=(a−b)(a+b), puis on simplifie par a−b≠0 : le taux vaut a+b.",t:"La simplification est permise uniquement parce que a≠b.",v:"square"},
{p:"6 · Fonction carré",q:"Quel est le sens de variation de <i>x↦x²</i> sur <i>[0,+∞[</i> ?",o:["Strictement décroissante","Strictement croissante","Constante","Ni croissante ni décroissante"],a:1,e:"Pour a,b≥0 distincts, le taux a+b est strictement positif.",t:"Il faut utiliser l’intervalle pour déterminer le signe de a+b."},
{p:"6 · Fonction carré",q:"Quel est le sens de variation de <i>x↦x²</i> sur <i>]−∞,0]</i> ?",o:["Strictement décroissante","Strictement croissante","Constante","Toujours positive donc croissante"],a:0,e:"Pour a,b≤0 distincts, a+b&lt;0 : le taux est strictement négatif.",t:"Le fait que x² soit positif ne détermine pas son sens de variation."},
{p:"6 · Fonction carré",q:"Sur ℝ tout entier, la fonction <i>x↦x²</i> est…",o:["Strictement croissante","Strictement décroissante","Ni croissante ni décroissante","Constante"],a:2,e:"Elle est décroissante sur ]−∞,0] puis croissante sur [0,+∞[.",t:"Un sens de variation doit toujours être associé à un intervalle précis.",v:"square"},
{p:"7 · Synthèse",q:"Pour tous a&lt;b dans I, le taux <i>(f(b)−f(a))/(b−a)</i> est strictement négatif. Alors <i>f</i> est…",o:["Strictement croissante sur I","Strictement décroissante sur I","Constante sur I","Positive sur I"],a:1,e:"Comme b−a&gt;0 et le taux est négatif, f(b)−f(a)&lt;0, donc f(b)&lt;f(a).",t:"Le signe du taux décrit la variation ; il ne décrit pas le signe de f(x).",v:"down"}
];
let i=0,score=0,student="",answers=[];const app=document.getElementById('app');const letters=['A','B','C','D'];
function brandHeader(label=''){return `<div class="fm-header"><img class="fm-logo" src="../logo-fm.svg" alt="Logo FM"><div class="fm-identity"><div class="fm-name">Faicel Missaoui</div><div class="fm-title">Professeur agrégé de mathématiques</div></div><div class="fm-right"><a class="fm-phone" href="tel:52266771"><small>Tél.</small>52266771</a>${label?`<span class="pill">${label}</span>`:''}</div></div>`}
function figure(kind){if(!kind)return '';if(kind==='order')return `<svg class="figure" viewBox="0 0 360 105" role="img" aria-label="a est à gauche de b"><line x1="28" y1="53" x2="332" y2="53" class="axis"/><polygon points="332,53 321,47 321,59" fill="#6e7789"/><line x1="112" y1="41" x2="112" y2="65" class="axis"/><line x1="250" y1="41" x2="250" y2="65" class="axis"/><circle cx="112" cy="53" r="5" class="dot-up"/><circle cx="250" cy="53" r="5" class="dot-up"/><text x="107" y="85" class="fig-text">a</text><text x="245" y="85" class="fig-text">b</text><text x="164" y="29" class="fig-text">a &lt; b</text></svg>`;if(kind==='square')return `<svg class="figure" viewBox="0 0 360 165" role="img" aria-label="Courbe de la fonction carré"><line x1="25" y1="135" x2="335" y2="135" class="axis"/><line x1="180" y1="150" x2="180" y2="18" class="axis"/><path d="M55 27 Q180 228 305 27" class="curve-up"/><text x="245" y="54" class="fig-text">y=x²</text></svg>`;const down=kind==='down';const secant=kind==='secant';return `<svg class="figure" viewBox="0 0 360 175" role="img" aria-label="${down?'Courbe décroissante':secant?'Sécante montante':'Courbe croissante'}"><line x1="34" y1="145" x2="335" y2="145" class="axis"/><line x1="45" y1="158" x2="45" y2="18" class="axis"/>${down?'<path d="M63 35 C120 49 180 86 310 129" class="curve-down"/>':secant?'<line x1="96" y1="121" x2="276" y2="48" class="curve-up"/>':'<path d="M63 128 C133 117 205 65 310 35" class="curve-up"/>'}<line x1="106" y1="145" x2="106" y2="${down?52:115}" class="guide"/><line x1="266" y1="145" x2="266" y2="${down?114:53}" class="guide"/><circle cx="106" cy="${down?52:115}" r="5" class="${down?'dot-down':'dot-up'}"/><circle cx="266" cy="${down?114:53}" r="5" class="${down?'dot-down':'dot-up'}"/><text x="100" y="167" class="fig-text">a</text><text x="260" y="167" class="fig-text">b</text><text x="82" y="${down?42:104}" class="fig-text">f(a)</text><text x="275" y="${down?119:45}" class="fig-text">f(b)</text></svg>`}
function shareQuiz(){const txt='QFM Première Spé — Monotonie d’une fonction — Faicel Missaoui : '+location.href;window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}
function start(){app.innerHTML=`${brandHeader('Première Spé · 20 questions · /20')}<h1>Monotonie d’une fonction</h1><p class="subtitle">Quiz progressif avec correction immédiate : fonctions croissantes et décroissantes, signe de f(a)−f(b), taux d’accroissement et fonction carré.</p><div class="rule"><b>Idée essentielle :</b> on fixe d’abord a&lt;b, puis on compare f(a) et f(b). Le sens de variation doit toujours être précisé sur un intervalle.</div><label for="student"><b>Prénom de l’élève</b> <span class="small">(facultatif)</span></label><input id="student" class="namebox" placeholder="Ex. Lina"><div class="actions"><button class="btn primary" id="begin">Commencer</button><button class="btn whatsapp" id="share">Partager ce quiz sur WhatsApp</button></div>`;document.getElementById('begin').onclick=begin;document.getElementById('share').onclick=shareQuiz}
function begin(){student=document.getElementById('student').value.trim();i=0;score=0;answers=[];render()}
function render(){const q=Q[i];const pct=(i/Q.length)*100;app.innerHTML=`${brandHeader(`Question ${i+1}/${Q.length}`)}<div class="topline"><span class="phase">${q.p}</span><span class="score">Score : ${score}/${Q.length}</span></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div>${figure(q.v)}<div class="question">${q.q}</div><div class="options" id="opts">${q.o.map((x,k)=>`<button class="option" data-k="${k}"><span class="letter">${letters[k]}</span>${x}</button>`).join('')}</div><div id="fb"></div><div class="actions" id="nextbox"></div>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>choose(Number(b.dataset.k)))}
function choose(k){const q=Q[i];const btns=[...document.querySelectorAll('.option')];btns.forEach(b=>b.disabled=true);btns[q.a].classList.add('correct');if(k!==q.a)btns[k].classList.add('wrong');const ok=k===q.a;if(ok)score++;answers.push({q:q.q.replace(/<[^>]+>/g,''),chosen:q.o[k],correct:q.o[q.a],ok,e:q.e});const fb=document.getElementById('fb');fb.className='feedback '+(ok?'good':'bad');fb.innerHTML=`<b>${ok?'Bonne réponse.':'À corriger.'}</b><br>${q.e}${ok?'':`<br><b>Réponse attendue :</b> ${q.o[q.a]}`}<div class="trap"><b>Erreur classique</b><br>${q.t}</div>`;const box=document.getElementById('nextbox');box.innerHTML=`<button class="btn primary" id="next">${i===Q.length-1?'Voir mon bilan':'Question suivante'}</button>`;document.getElementById('next').onclick=()=>{i++;if(i<Q.length)render();else finish()}}
function finish(){const pct=Math.round(score/Q.length*100);let msg=score>=18?'Maîtrise très solide':score>=15?'Bon niveau':score>=12?'Bases acquises, quelques automatismes à renforcer':score>=8?'Révisions ciblées nécessaires':'Reprendre les comparaisons avant le taux d’accroissement';app.innerHTML=`${brandHeader('Bilan')}<h2>${student?student+', ':''}résultat du quiz</h2><div class="result">${score}/20</div><p class="subtitle"><b>${msg}</b></p><div class="summary"><div class="metric"><span class="small">Réussite</span><b>${pct}%</b></div><div class="metric"><span class="small">Erreurs</span><b>${Q.length-score}</b></div></div><div class="actions"><button class="btn primary" id="review">Revoir uniquement mes erreurs</button><button class="btn secondary" id="restart">Recommencer</button><button class="btn whatsapp" id="shareScore">Partager mon score sur WhatsApp</button></div><div id="errors" class="errors hidden"></div>`;document.getElementById('restart').onclick=start;document.getElementById('review').onclick=review;document.getElementById('shareScore').onclick=shareScore}
function review(){const e=document.getElementById('errors');const wrong=answers.filter(x=>!x.ok);e.classList.remove('hidden');e.innerHTML=wrong.length?wrong.map((x,n)=>`<div class="error"><div class="q">${n+1}. ${x.q}</div><div>Ta réponse : ${x.chosen}</div><div class="corr">Correction : ${x.correct}</div><div class="small">${x.e}</div></div>`).join(''):`<div class="feedback good"><b>20/20 :</b> aucune erreur à revoir.</div>`;e.scrollIntoView({behavior:'smooth',block:'start'})}
function shareScore(){const who=student?student+' : ':'';const txt=`${who}${score}/20 au QFM Première Spé de Faicel Missaoui — Monotonie d’une fonction. ${location.href}`;window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}
start();
</script>
