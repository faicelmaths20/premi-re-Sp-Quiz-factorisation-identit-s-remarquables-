:#7a271a}.actions{display:grid;gap:9px;margin-top:13px}.result{font-size:3.5rem;font-weight:950;letter-spacing:-.04em;margin:8px 0;color:var(--navy)}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}.metric{border:1px solid var(--border);border-radius:12px;padding:12px;background:#fafbfc}.metric b{display:block;font-size:1.35rem}.errors{display:grid;gap:10px;margin-top:16px}.error{border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff}.error .q{font-weight:800}.error .corr{color:var(--good);font-weight:800;margin-top:5px}.figure{margin:12px auto 15px;max-width:560px}.figure svg{width:100%;height:auto;border:1px solid var(--border);border-radius:13px;background:#fff}.footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:12px}.footer strong{font-family:Georgia,serif;color:var(--navy)}.hidden{display:none}

const Q=[{"p": "1 · Prérequis : coefficients", "q": "Dans <b>P(x)=−2x²+3x+2</b>, quels sont les coefficients a, b et c ?", "o": ["a=2, b=3, c=2", "a=−2, b=3, c=2", "a=−2, b=−3, c=2", "a=−2, b=3, c=−2"], "a": 1, "e": "On compare à ax²+bx+c : <b>a=−2, b=3, c=2</b>. Le signe fait partie du coefficient : ne pas perdre le − devant 2x²."}, {"p": "1 · Prérequis : signes", "q": "Si <b>b=−5</b>, quelles sont les valeurs de <b>b²</b> et de <b>−b</b> ?", "o": ["b²=−25 et −b=5", "b²=25 et −b=−5", "b²=−25 et −b=−5", "b²=25 et −b=5"], "a": 3, "e": "<b>b²=(−5)²=25</b>, tandis que <b>−b=−(−5)=5</b>. Attention : −5² signifie −(5²)=−25 ; les parenthèses sont indispensables quand on remplace b."}, {"p": "1 · Prérequis : carré", "q": "Résoudre dans ℝ : <b>x²=9</b>.", "o": ["S={−3 ; 3}", "S={3}", "S={−9 ; 9}", "S=∅"], "a": 0, "e": "<b>x²=9 ⇔ x=−3 ou x=3</b>, car (−3)²=3²=9. Ne pas oublier la solution négative. √9=3 est la racine carrée positive, mais l’équation possède deux solutions."}, {"p": "1 · Lecture graphique", "q": "La courbe représente <b>f(x)=(x−1)²−1</b>. Quel est l’ensemble des solutions de <b>f(x)=0</b> ?", "o": ["S={1}", "S={−1 ; 1}", "S={0 ; 2}", "S=[0 ; 2]"], "a": 2, "e": "On lit les <b>abscisses des intersections avec l’axe horizontal</b> : 0 et 2. Par le calcul : (x−1)²=1 ⇔ x−1=−1 ou x−1=1. Ainsi S={0 ; 2}. Un intervalle contiendrait ici des valeurs qui ne sont pas des racines.", "fig": "roots"}, {"p": "2 · Définir le discriminant", "q": "Pour <b>ax²+bx+c</b>, avec <b>a≠0</b>, quelle est la formule du discriminant ?", "o": ["Δ=b²+4ac", "Δ=−b/(2a)", "Δ=b−4ac", "Δ=b²−4ac"], "a": 3, "e": "<b>Δ=b²−4ac</b>. C’est un nombre calculé à partir des coefficients, pas une solution. L’identité 4aP(x)=(2ax+b)²−Δ donne P(x)=0 ⇔ (2ax+b)²=Δ : le signe de Δ explique le nombre de racines réelles."}, {"p": "2 · Calculer le discriminant", "q": "Quel est le discriminant de <b>2x²−5x+2</b> ?", "o": ["Δ=41", "Δ=9", "Δ=−41", "Δ=3"], "a": 1, "e": "a=2, b=−5 et c=2. <b>Δ=(−5)²−4×2×2=25−16=9</b>. 3 est √Δ, pas Δ ; 41 correspondrait à une erreur de signe devant 4ac."}, {"p": "2 · Deux racines distinctes", "q": "Résoudre dans ℝ : <b>2x²−5x+2=0</b>. On a Δ=9.", "o": ["S={−2 ; −1/2}", "S={1 ; 4}", "S={1/2 ; 2}", "S={9}"], "a": 2, "e": "Δ&gt;0 : deux racines distinctes. <b>(5−3)/4=1/2</b> et <b>(5+3)/4=2</b>. Le dénominateur 2a=4 porte sur tout le numérateur. Δ=9 n’est pas une solution."}, {"p": "2 · Préparer l’équation", "q": "Avant d’utiliser le discriminant pour <b>3x²+4=8x</b>, quelle équation doit-on écrire ?", "o": ["3x²−8x+4=0", "3x²+8x+4=0", "3x²−8x−4=0", "3x²+4=0"], "a": 0, "e": "On soustrait 8x aux deux membres : <b>3x²−8x+4=0</b>. On identifie ensuite a=3, b=−8 et c=4. Les coefficients doivent être lus après avoir obtenu un membre nul."}, {"p": "3 · Une racine double", "q": "Pour <b>x²−6x+9=0</b>, on trouve Δ=0. Quelle est la conclusion correcte ?", "o": ["Aucune solution réelle", "Deux solutions distinctes : −3 et 3", "Une seule solution réelle : 3", "Une seule solution réelle : 0"], "a": 2, "e": "<b>x₀=−b/(2a)=6/2=3</b>. L’expression vaut (x−3)². Une racine « double » correspond à <b>une seule valeur</b> de x : S={3}. Δ=0 ne signifie pas x=0."}, {"p": "3 · Aucune racine réelle", "q": "Pour <b>3x²+2x+1=0</b>, on obtient Δ=−8. Quel est l’ensemble des solutions dans ℝ ?", "o": ["S=∅", "S={−8}", "S={−1/3}", "S=ℝ"], "a": 0, "e": "<b>Δ&lt;0 : aucune solution réelle</b>. L’équation serait équivalente à un carré réel égal à −8, ce qui est impossible. On ne calcule pas √(−8) dans ℝ."}, {"p": "3 · Coefficient a négatif", "q": "Les racines de <b>−2x²+3x+2</b> sont obtenues avec Δ=25. Lesquelles sont rangées dans l’ordre croissant ?", "o": ["x₁=2 et x₂=−1/2", "x₁=−2 et x₂=1/2", "x₁=1/2 et x₂=2", "x₁=−1/2 et x₂=2"], "a": 3, "e": "Les formules donnent (−3−5)/(−4)=2 et (−3+5)/(−4)=−1/2. On les range ensuite : <b>−1/2&lt;2</b>. Lorsque a&lt;0, la formule avec −√Δ ne donne pas la plus petite racine."}, {"p": "3 · Factoriser avec les racines", "q": "Quelle factorisation de <b>−2x²+3x+2</b> est correcte ?", "o": ["(x+1/2)(x−2)", "−2(x+1/2)(x−2)", "−2(x−1/2)(x−2)", "−2(x+1/2)(x+2)"], "a": 1, "e": "Avec a=−2 et les racines −1/2 et 2 : <b>P(x)=−2(x+1/2)(x−2)</b>. Il faut conserver le coefficient a et écrire x−(−1/2)=x+1/2. Développer redonne −2x²+3x+2."}, {"p": "4 · Signe et courbe", "q": "La courbe représente <b>P(x)=−2x²+3x+2</b>. Résoudre <b>P(x)&gt;0</b>.", "o": ["]−1/2 ; 2[", "]−∞ ; −1/2[ ∪ ]2 ; +∞[", "[−1/2 ; 2]", "{−1/2 ; 2}"], "a": 0, "e": "La courbe est <b>strictement au-dessus de l’axe</b> entre −1/2 et 2. Comme a&lt;0, P est positif entre les racines et négatif à l’extérieur. L’inégalité est stricte : les deux racines sont exclues.", "fig": "negative"}, {"p": "4 · Inégalité large", "q": "À partir du tableau, résoudre <b>2x²−5x+2≤0</b>.", "o": ["]1/2 ; 2[", "]−∞ ; 1/2] ∪ [2 ; +∞[", "[1/2 ; 2]", "{1/2 ; 2}"], "a": 2, "e": "On retient le signe − et les zéros : <b>S=[1/2 ; 2]</b>. Les racines sont incluses car 0≤0 est vrai. Les deux racines seules résoudraient l’équation, pas toute l’inéquation.", "fig": "signs"}, {"p": "4 · Inégalité stricte", "q": "Pour le même trinôme, résoudre <b>2x²−5x+2&gt;0</b>. Ses racines sont 1/2 et 2, et a&gt;0.", "o": ["[1/2 ; 2]", "]−∞ ; 1/2[ ∪ ]2 ; +∞[", "]−∞ ; 1/2] ∪ [2 ; +∞[", "]1/2 ; 2["], "a": 1, "e": "Le trinôme est <b>positif à l’extérieur</b> des racines. Le signe &gt; exclut les racines : <b>S=]−∞ ; 1/2[ ∪ ]2 ; +∞[</b>. Les bornes infinies sont toujours ouvertes."}, {"p": "5 · Le cas Δ=0", "q": "Résoudre dans ℝ : <b>(x−2)²≤0</b>.", "o": ["S=ℝ", "S=∅", "S=]−∞ ; 2]", "S={2}"], "a": 3, "e": "Un carré est toujours positif ou nul. Pour être ≤0, il doit donc être <b>égal à zéro</b> : x−2=0, soit x=2. Attention : avec &lt;0, il n’y aurait aucune solution ; avec ≥0, tous les réels conviendraient."}, {"p": "5 · Le cas Δ&lt;0", "q": "Pour <b>P(x)=−2x²+4x−5</b>, on a Δ=−24. Résoudre <b>P(x)≥0</b>.", "o": ["S=ℝ", "S={1}", "S=∅", "S=[−2 ; 4]"], "a": 2, "e": "Δ&lt;0 : P n’a aucune racine et reste <b>strictement du signe de a</b>. Ici a=−2&lt;0, donc P(x)&lt;0 pour tout x : S=∅. C’est la combinaison de Δ&lt;0 et de a&lt;0 qui permet de conclure."}, {"p": "5 · Racines irrationnelles", "q": "Résoudre <b>x²−2x−1≥0</b>. Les racines sont 1−√2 et 1+√2.", "o": ["]−∞ ; 1−√2] ∪ [1+√2 ; +∞[", "[1−√2 ; 1+√2]", "]−∞ ; 1−√2[ ∪ ]1+√2 ; +∞[", "{1−√2 ; 1+√2}"], "a": 0, "e": "Δ=8 et √8=2√2 donnent les racines 1±√2. Comme a=1&gt;0, on retient <b>l’extérieur des racines</b>. Le signe ≥ permet de les inclure. Garder les valeurs exactes évite les erreurs d’arrondi sur les bornes."}, {"p": "6 · Synthèse : comparer deux courbes", "q": "On pose <b>f(x)=x²−2x−3</b> et <b>g(x)=x−3</b>. Pour quelles valeurs de x a-t-on <b>f(x)≤g(x)</b> ?", "o": ["S=[−1 ; 3]", "S=[0 ; 3]", "S=]−∞ ; 0] ∪ [3 ; +∞[", "S={0 ; 3}"], "a": 1, "e": "<b>f(x)≤g(x) ⇔ f(x)−g(x)≤0 ⇔ x(x−3)≤0</b>, donc S=[0 ; 3]. Sur cet intervalle, la parabole est sous la droite ou la rencontre. Il faut comparer leurs ordonnées, et non résoudre f(x)≤0.", "fig": "compare"}, {"p": "6 · Synthèse : une aire", "q": "Un rectangle a pour dimensions <b>x−1</b> et <b>x+4</b> cm, avec <b>x&gt;1</b>. Pour quelles valeurs admissibles de x son aire est-elle <b>au plus 50 cm²</b> ?", "o": ["S=[−9 ; 6]", "S=[1 ; 6]", "S=]1 ; 6[", "S=]1 ; 6]"], "a": 3, "e": "A(x)=(x−1)(x+4)=x²+3x−4. Ainsi A(x)≤50 ⇔ x²+3x−54≤0. Les racines sont −9 et 6 (Δ=225), d’où [−9 ; 6] dans ℝ. On respecte ensuite x&gt;1 : <b>S=[−9 ; 6] ∩ ]1 ; +∞[=]1 ; 6]</b>. La borne 1 est exclue (largeur nulle), mais 6 est incluse (aire exactement 50)."}];

function fig(type){
if(!type)return '';
if(type==='signs')return `<div class="figure"><svg viewBox="0 0 560 150" role="img" aria-label="Tableau de signes : le trinôme est positif avant un demi, nul en un demi, négatif entre un demi et deux, nul en deux, positif après deux."><rect x="8" y="12" width="544" height="124" fill="white" stroke="#64748b"/><path d="M8 69H552M140 12V136" stroke="#64748b"/><g font-family="system-ui,sans-serif" font-size="18" text-anchor="middle" fill="#172033"><text x="74" y="48">x</text><text x="74" y="110" font-size="16">2x²−5x+2</text><text x="171" y="48">−∞</text><text x="270" y="48">1/2</text><text x="420" y="48">2</text><text x="521" y="48">+∞</text><text x="206" y="110">+</text><text x="270" y="110">0</text><text x="345" y="110">−</text><text x="420" y="110">0</text><text x="486" y="110">+</text></g></svg></div>`;
const config={roots:{x0:-1.5,x1:3.5,y0:-2,y1:5,lines:[{a:1,b:-2,c:0,color:'#167b7a'}],desc:'Courbe de f(x)=(x−1)²−1 dans un repère gradué.'},negative:{x0:-2,x1:3.5,y0:-5,y1:4,lines:[{a:-2,b:3,c:2,color:'#167b7a'}],desc:'Courbe de P(x)=−2x²+3x+2 dans un repère gradué.'},compare:{x0:-1.5,x1:4.5,y0:-5,y1:4,lines:[{a:1,b:-2,c:-3,color:'#167b7a'},{a:0,b:1,c:-3,color:'#2447d8'}],desc:'Parabole de f(x)=x²−2x−3 en vert et droite de g(x)=x−3 en bleu.'}}[type];
if(!config)return '';
const c=config,W=560,H=315,L=45,R=25,T=22,B=33;
const X=x=>L+(x-c.x0)*(W-L-R)/(c.x1-c.x0),Y=y=>H-B-(y-c.y0)*(H-T-B)/(c.y1-c.y0);
let s=`<div class="figure"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.desc}"><defs><clipPath id="plotclip"><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}"/></clipPath></defs><rect width="${W}" height="${H}" fill="white"/>`;
for(let x=Math.ceil(c.x0);x<=c.x1;x++){s+=`<path d="M${X(x)} ${T}V${H-B}" stroke="#dbe4eb"/>`;if(x!==0)s+=`<text x="${X(x)}" y="${Y(0)+20}" font-size="15" text-anchor="middle" fill="#475569">${x}</text>`}
for(let y=Math.ceil(c.y0);y<=c.y1;y++){s+=`<path d="M${L} ${Y(y)}H${W-R}" stroke="#dbe4eb"/>`;if(y!==0)s+=`<text x="${X(0)-9}" y="${Y(y)+5}" font-size="15" text-anchor="end" fill="#475569">${y}</text>`}
s+=`<path d="M${L} ${Y(0)}H${W-R+6}M${X(0)} ${H-B}V${T-6}" stroke="#334155" stroke-width="1.6"/><text x="${X(0)-8}" y="${Y(0)+19}" font-size="15" text-anchor="end">0</text><text x="${W-R+10}" y="${Y(0)+5}" font-size="16">x</text><text x="${X(0)+9}" y="${T-6}" font-size="16">y</text><g clip-path="url(#plotclip)">`;
for(const f of c.lines){let d='';for(let n=0;n<=300;n++){const x=c.x0+(c.x1-c.x0)*n/300;d+=(n?'L':'M')+X(x).toFixed(2)+' '+Y(f.a*x*x+f.b*x+f.c).toFixed(2)+' '}s+=`<path d="${d}" fill="none" stroke="${f.color}" stroke-width="3"/>`}
s+='</g>';
if(type==='compare')s+='<rect x="376" y="23" width="156" height="28" rx="5" fill="white"/><text x="386" y="43" font-size="16" fill="#167b7a">C_f</text><text x="456" y="43" font-size="16" fill="#2447d8">C_g</text>';
return s+'</svg></div>';
}
function start(){app.innerHTML=head()+`<h1>QFM — Équations et inéquations du second degré</h1><p class="subtitle">Discriminant : prérequis → équations → signe du trinôme → inéquations → synthèse. Toutes les résolutions se font dans ℝ.</p><div class="rule"><b>20 questions = note directe sur 20.</b><br><span class="small">Une seule réponse correcte. Correction immédiate après chaque question.</span></div><label for="name"><b>Prénom et nom</b> <span class="small">(facultatif)</span></label><input class="namebox" id="name" maxlength="80" placeholder="Ex. Lina Ben Ali"><button class="btn primary" onclick="go()">Commencer le QFM</button><div class="actions"><button class="btn whatsapp" onclick="share()">Partager sur WhatsApp</button></div>`}
function go(){student=(document.getElementById('name').value||'Élève').trim(); i=0;score=0;wrong=[];showQ()}
function showQ(){answered=false;const q=Q[i];app.innerHTML=head()+`<div class="topline"><div class="phase">${q.p}</div><div class="score">Score : ${score}/20</div></div><div class="progress"><div class="bar" style="width:${(i/20)*100}%"></div></div><div class="small">Question ${i+1} / 20</div>${fig(q.fig)}<div class="question">${q.q}</div><div class="options">${q.o.map((x,k)=>`<button class="option" onclick="ans(${k},this)"><span class="letter">${letters[k]}</span>${x}</button>`).join('')}</div><div id="fb" aria-live="polite"></div><div class="actions"><button id="next" class="btn primary hidden" onclick="next()">${i===19?'Voir mon bilan':'Question suivante'}</button></div>`}
function ans(k,b){if(answered)return;answered=true;const q=Q[i],opts=[...document.querySelectorAll('.option')];opts.forEach(x=>x.disabled=true);opts[q.a].classList.add('correct');let ok=k===q.a;if(ok){score++;document.getElementById('fb').innerHTML=`<div class="feedback good"><b>Bonne réponse.</b><br>${q.e}</div>`}else{b.classList.add('wrong');wrong.push({n:i+1,q:q.q,good:q.o[q.a],e:q.e});document.getElementById('fb').innerHTML=`<div class="feedback bad"><b>À corriger.</b><br>${q.e}</div>`}document.querySelector('.score').textContent=`Score : ${score}/20`;document.getElementById('next').classList.remove('hidden')}
function next(){if(!answered)return;if(i<19){i++;showQ()}else end()}
function end(){let level=score>=18?'Maîtrise très solide':score>=15?'Bonne maîtrise':score>=10?'Bases acquises, à consolider':'Reprise ciblée conseillée';app.innerHTML=head()+`<h1>Bilan QFM — ${escapeText(student)}</h1><div class="result">${score}/20</div><h2>${level}</h2><div class="summary"><div class="metric"><span>Bonnes réponses</span><b>${score}</b></div><div class="metric"><span>À revoir</span><b>${20-score}</b></div></div><div class="actions"><button class="btn primary" onclick="review()">Revoir mes erreurs uniquement</button><button class="btn" onclick="start()">Recommencer</button><button class="btn whatsapp" onclick="share()">Partager sur WhatsApp</button></div><div id="errs"></div>`}
function review(){const d=document.getElementById('errs');if(!wrong.length){d.innerHTML='<div class="feedback good">Aucune erreur : parcours entièrement réussi.</div>';return}d.innerHTML='<div class="errors">'+wrong.map(x=>`<div class="error"><div class="q">Question ${x.n} — ${x.q}</div><div class="corr">Réponse correcte : ${x.good}</div><div class="small">${x.e}</div></div>`).join('')+'</div>'}
function share(){const u=location.href;const t=`QFM — Équations et inéquations du second degré · Première spécialité\nQuiz progressif de Faicel Missaoui\n${u}`;window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank','noopener,noreferrer')}
start();
</script></body></html>
