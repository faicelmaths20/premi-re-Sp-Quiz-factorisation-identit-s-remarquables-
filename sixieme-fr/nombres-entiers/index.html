{g:'Chiffres et nombres',q:'Combien de chiffres utilise-t-on pour écrire les nombres entiers en écriture décimale ?',o:['9','10','26','Une infinité'],a:1,e:'On utilise dix chiffres : 0, 1, 2, 3, 4, 5, 6, 7, 8 et 9. Avec eux, on peut écrire une infinité de nombres.'},
{g:'Chiffres et nombres',q:'Combien de chiffres faut-il pour écrire le nombre 2 024 ?',o:['3','5','4','2'],a:2,e:'2 024 comporte quatre chiffres : 2, 0, 2 et 4. Le chiffre 2 apparaît deux fois : on compte chacune de ses places.'},
{g:'Chiffres et nombres',q:'Quelle affirmation est vraie à propos du nombre 7 ?',o:['Il ne peut pas être un nombre.','Il s’écrit avec sept chiffres.','Il s’écrit avec un seul chiffre.','Il s’écrit avec deux chiffres.'],a:2,e:'7 est un nombre entier naturel. Son écriture utilise un seul chiffre, le chiffre 7. Un nombre peut donc s’écrire avec un seul chiffre.'},
{g:'Rang et valeur',v:'cards',q:'Avec ces cartes, on écrit 247 puis 724. Dans 724, quelle valeur représente le chiffre 7 ?',o:['7 unités','7 dizaines, soit 70 unités','7 milliers, soit 7 000 unités','7 centaines, soit 700 unités'],a:3,e:'Dans 724, le chiffre 7 occupe le rang des centaines : il représente 700 unités. Dans 247, ce même chiffre représente seulement 7 unités. Sa valeur dépend de sa position.'},
{g:'Rang et valeur',v:'table',q:'Dans 24 307, quel est le chiffre des centaines ?',o:['4','3','0','7'],a:1,e:'En partant de la droite : 7 unités, 0 dizaine, 3 centaines, 4 unités de mille et 2 dizaines de mille. Le chiffre des centaines est donc 3.'},
{g:'Rang et valeur',v:'table',q:'Dans 24 307, quelle est la valeur représentée par le chiffre 4 ?',o:['4','40','400','4 000'],a:3,e:'4 est le chiffre des unités de mille. Il représente donc 4 × 1 000 = 4 000 unités.'},
{g:'Rang et valeur',q:'Peut-on supprimer le zéro dans 24 307 sans changer le nombre ?',o:['Non : on obtiendrait 2 437.','Oui : un zéro ne compte jamais.','Oui : le chiffre des unités reste 7.','Non : on obtiendrait 24 370.'],a:0,e:'Supprimer ce zéro donne 2 437. Les chiffres situés à sa gauche changent de rang. Le zéro garde donc une place essentielle dans 24 307.'},
{g:'Lire et écrire',q:'Comment regroupe-t-on les chiffres d’un grand nombre pour le lire facilement ?',o:['Par deux en partant de la gauche.','Par trois en partant de la gauche.','Par trois en partant de la droite.','Par quatre en partant de la droite.'],a:2,e:'On forme des groupes de trois chiffres en partant de la droite. Le groupe le plus à gauche peut contenir un, deux ou trois chiffres.'},
{g:'Lire et écrire',q:'Quelle écriture sépare correctement les classes de 72004015 ?',o:['720 040 15','72 004 015','7 200 401 5','72 040 015'],a:1,e:'À partir de la droite, on obtient les groupes 015, puis 004, puis 72. Le nombre s’écrit 72 004 015 : soixante-douze millions quatre mille quinze.'},
{g:'Lire et écrire',q:'Comment écrit-on « six millions trente mille neuf » en chiffres ?',o:['6 300 009','6 030 090','6 003 009','6 030 009'],a:3,e:'On place les classes : 6 millions | 030 milliers | 009 unités. On obtient 6 030 009. Les zéros permettent de respecter les rangs.'},
{g:'Lire et écrire',v:'big',q:'Comment se lit ce nombre ?',o:['Trois milliards quarante millions cinq cent six mille vingt-sept.','Trois milliards quatre millions cinq cent six mille vingt-sept.','Trois milliards quarante millions cinquante-six mille vingt-sept.','Trois millions quarante mille cinq cent six.'],a:0,e:'Les quatre classes sont 3 | 040 | 506 | 027 : trois milliards, quarante millions, cinq cent six mille, vingt-sept.'},
{g:'Décomposer',q:'Une centaine contient combien de dizaines ?',o:['100','1','10','1 000'],a:2,e:'Une centaine vaut 100 unités et une dizaine vaut 10 unités. Comme 100 = 10 × 10, une centaine contient dix dizaines.'},
{g:'Décomposer',q:'Quelle est une décomposition correcte de 3 042 ?',o:['(3 × 1 000) + (4 × 100) + 2','(3 × 100) + (4 × 10) + 2','(3 × 1 000) + (4 × 10) + 2','(3 × 1 000) + (2 × 10) + 4'],a:2,e:'3 042 contient 3 milliers, 0 centaine, 4 dizaines et 2 unités : 3 000 + 40 + 2 = 3 042.'},
{g:'Décomposer',q:'Complète : 24 307 = (2 × 10 000) + (4 × …) + (3 × 100) + 7.',o:['10','100','1 000','10 000'],a:2,e:'Le chiffre 4 est au rang des unités de mille. Il faut donc multiplier 4 par 1 000 : 20 000 + 4 000 + 300 + 7 = 24 307.'},
{g:'Décomposer',q:'Quel nombre vaut (5 × 10 000) + (8 × 10) + 2 ?',o:['50 082','5 082','50 802','50 820'],a:0,e:'5 × 10 000 = 50 000 et 8 × 10 = 80. Ainsi, 50 000 + 80 + 2 = 50 082.'},
{g:'Chiffre ou nombre de dizaines',q:'Dans 247, quel est le chiffre des dizaines ?',o:['24','4','2','7'],a:1,e:'Le chiffre des dizaines est celui de la deuxième position en partant de la droite : c’est 4. À distinguer du nombre de dizaines entières contenues dans 247, qui est 24.'},
{g:'Chiffre ou nombre de dizaines',q:'On range 247 crayons dans des boîtes de 10. Combien de boîtes peut-on remplir complètement ?',o:['4','25','7','24'],a:3,e:'247 = (24 × 10) + 7. On remplit 24 boîtes et il reste 7 crayons. 247 contient donc 24 dizaines entières.'},
{g:'Chiffre ou nombre de dizaines',q:'Dans 368, quels sont le chiffre des dizaines et le nombre de dizaines entières ?',o:['Le chiffre est 6 ; le nombre est 36.','Le chiffre est 36 ; le nombre est 6.','Le chiffre est 6 ; le nombre est 6.','Le chiffre est 3 ; le nombre est 36.'],a:0,e:'Le chiffre des dizaines est 6. Mais 368 = (36 × 10) + 8 : il contient 36 dizaines entières et 8 unités restantes.'}
];
const $=id=>document.getElementById(id); let order=questions.map((_,i)=>i),position=0,answers=[],locked=false,revision=false;
function progress(){const n=order.length; $('counter').textContent=`${revision?'Révision · ':''}Question ${Math.min(position+1,n)} / ${n}`;$('points').textContent=`${answers.filter(x=>x.ok).length} bonne${answers.filter(x=>x.ok).length===1?'':'s'} réponse${answers.filter(x=>x.ok).length===1?'':'s'}`;$('bar').style.width=`${answers.length/n*100}%`;$('progress').setAttribute('aria-valuemax',n);$('progress').setAttribute('aria-valuenow',answers.length);}
function render(focus=true){locked=false;progress();const q=questions[order[position]];$('topic').textContent=q.g;$('question').textContent=q.q;$('feedback').hidden=true;$('feedback').replaceChildren();$('next').hidden=true;const v=$('visual');v.hidden=!q.v;v.innerHTML=q.v==='cards'?'<div class="digits" aria-label="Cartes 2, 4 et 7"><span class="digit">2</span><span class="digit">4</span><span class="digit">7</span></div>':q.v==='table'?'<div class="tablewrap"><table><caption>Le nombre 24 307</caption><thead><tr><th scope="col">Dizaines de mille</th><th scope="col">Unités de mille</th><th scope="col">Centaines</th><th scope="col">Dizaines</th><th scope="col">Unités</th></tr></thead><tbody><tr><td>2</td><td>4</td><td>3</td><td>0</td><td>7</td></tr></tbody></table></div>':q.v==='big'?'<span class="number">3 040 506 027</span>':'';$('choices').replaceChildren();q.o.forEach((s,i)=>{const b=document.createElement('button');b.className='answer';const l=document.createElement('span');l.className='letter';l.textContent='ABCD'[i];l.setAttribute('aria-hidden','true');const t=document.createElement('span');t.textContent=s;b.append(l,t);b.onclick=()=>answer(i);$('choices').append(b)});if(focus)$('question').focus();}
function answer(choice){if(locked)return;locked=true;const id=order[position],q=questions[id],ok=choice===q.a;answers.push({id,choice,ok});[...$('choices').children].forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct');if(i===choice&&!ok)b.classList.add('wrong');if(i===q.a||i===choice){const s=document.createElement('span');s.className='status';s.textContent=i===q.a?'✓ Bonne réponse':'✕ Ta réponse';b.lastChild.append(s)}});$('feedback').innerHTML=`<h3>${ok?'Bien joué !':'À comprendre'}</h3><p>${q.e}</p>`;$('feedback').hidden=false;$('next').textContent=position===order.length-1?'Voir mon bilan':'Question suivante';$('next').hidden=false;progress();}
$('next').onclick=()=>{position++;if(position<order.length)render();else finish()};
function restart(ids,rev){order=ids;revision=rev;position=0;answers=[];locked=false;$('result').hidden=true;$('quiz').hidden=false;render();}
function finish(){const score=answers.filter(x=>x.ok).length,wrong=answers.filter(x=>!x.ok);$('quiz').hidden=true;const r=$('result');r.hidden=false;$('counter').textContent=revision?'Révision terminée':'Quiz terminé';r.innerHTML=`<div class="topic">${revision?'Bilan de la révision':'Mon bilan'}</div><h2>Ce que j’ai compris</h2><div class="score">${score} / ${order.length}</div><p>${score===order.length?'Toutes les réponses sont justes. Bravo pour ton travail !':'Relis les explications, puis reprends les questions à retravailler.'}</p><ul class="summary"></ul><div class="actions" id="resultActions"></div><div id="reviews"></div>`;const ul=r.querySelector('.summary');[...new Set(order.map(id=>questions[id].g))].forEach(g=>{const arr=answers.filter(x=>questions[x.id].g===g),li=document.createElement('li');li.innerHTML=`<span>${g}</span><strong>${arr.filter(x=>x.ok).length} / ${arr.length}</strong>`;ul.append(li)});if(wrong.length){const b=document.createElement('button');b.className='primary';b.textContent=`Revoir ${wrong.length===1?'ma question':`mes ${wrong.length} questions`}`;b.onclick=()=>restart(wrong.map(x=>x.id),true);$('resultActions').append(b)}const b=document.createElement('button');b.className='secondary';b.textContent='Recommencer les 18 questions';b.onclick=()=>restart(questions.map((_,i)=>i),false);$('resultActions').append(b);wrong.forEach(x=>{const q=questions[x.id],d=document.createElement('div');d.className='review';d.innerHTML=`<h3>${q.q}</h3><p><strong>Bonne réponse :</strong> ${q.o[q.a]}</p><p>${q.e}</p>`;$('reviews').append(d)});r.focus();}
render(false);
</script></body></html>
